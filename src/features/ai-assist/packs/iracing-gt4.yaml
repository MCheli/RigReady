format: 1
game: iracing
car:
  id: gt4
  name: GT4
summary: >-
  GT4 cars are slower and simpler than GT3: less power, less downforce and fewer settings in
  the cockpit. Bind the pedals, the shift paddles and the pit limiter first. Then ABS, traction
  control and brake bias on the rim, for the cars that let you change them while driving.
sources:
  - >-
    Written from general knowledge of GT4 racing and of iRacing's controls. Not reviewed by a
    racing driver. Not affiliated with or reviewed by iRacing.
  - >-
    Every action is named by iRacing's own id, as in its controls file; a test checks each one
    against iRacing's list of 369 actions (November 2026).
  - >-
    Cars differ: a car without a control (brake bias on a car that does not let you change it)
    ignores its binding.
roles:
  wheel:
    summary: >-
      The paddles and the pit limiter, then ABS, traction control and brake bias, the black box
      buttons, the headlight flash and push to talk.
    items:
      [
        steering,
        shift,
        pit-limiter,
        abs,
        traction-control,
        brake-bias,
        black-box,
        headlights,
        push-to-talk,
      ]
  pedals:
    summary: Throttle and brake, and the clutch if your pedals have one.
    items: [throttle, brake, clutch]
  panel:
    summary: The starter, the dash pages, the wipers and the glances left and right.
    items: [starter, dash-page, wipers, look-sideways]
  keyboard:
    summary: Black box settings, force feedback strength and chat are fine on the keyboard.
    items: [black-box-values, force-feedback, text-chat]
items:
  - id: steering
    title: Steering
    tier: must
    place: rim
    role: wheel
    input: axis
    what: >-
      Turns the front wheels. iRacing stores the wheel as one axis in two halves, one for each
      way of turning.
    when: All the time.
    note: >-
      Bind it in iRacing: Options, then Controls, then Calibrate. Turn the wheel from lock to
      lock when iRacing asks.
    actions:
      - { name: SteerLeft, label: Steer left }
      - { name: SteerRight, label: Steer right }
  - id: throttle
    title: Throttle
    tier: must
    place: rim
    role: pedals
    input: axis
    what: The accelerator pedal.
    when: All the time.
    note: Bind and calibrate it in iRacing with the wheel, in the same steps.
    actions:
      - { name: Throttle, label: Throttle }
  - id: brake
    title: Brake
    tier: must
    place: rim
    role: pedals
    input: axis
    what: The brake pedal. With ABS on, pressing hard does not lock the wheels.
    when: Every corner.
    note: Bind and calibrate it in iRacing. Press the pedal as hard as you will in a race.
    actions:
      - { name: Brake, label: Brake }
  - id: shift
    title: Shift up and down
    tier: must
    place: rim
    role: wheel
    what: The paddles behind the wheel.
    when: Every corner and every straight.
    actions:
      - { name: ShiftUp, label: Shift up }
      - { name: ShiftDown, label: Shift down }
  - id: pit-limiter
    title: Pit speed limiter
    tier: must
    place: rim
    role: wheel
    what: Holds the car at the pit lane speed limit. Speeding in the pit lane earns a penalty.
    when: Turn it on before the pit entry line and off after the pit exit line.
    actions:
      - { name: PitSpeedLimiter, label: Pit speed limiter }
  - id: abs
    title: ABS
    tier: should
    place: rim
    role: wheel
    what: >-
      Changes how much the ABS steps in under braking, on cars that let you. The black box shows
      the setting.
    when: As the tyres wear, or in the wet.
    actions:
      - { name: ABSInc, label: ABS up }
      - { name: ABSDec, label: ABS down }
  - id: traction-control
    title: Traction control
    tier: should
    place: rim
    role: wheel
    what: >-
      Changes how much the traction control cuts power when the rear wheels spin, on cars that
      let you. Which way is more depends on the car.
    when: When the tyres are cold or worn, or when it starts to rain.
    actions:
      - { name: TractionControlInc, label: Traction control up }
      - { name: TractionControlDec, label: Traction control down }
  - id: brake-bias
    title: Brake bias
    tier: should
    place: rim
    role: wheel
    what: >-
      Moves the braking between the front and rear wheels, on cars that let you change it while
      driving. The black box shows it as the share on the front; up raises it.
    when: When the rear feels loose or the fronts lock under braking.
    actions:
      - { name: BrakeBiasInc, label: Brake bias up }
      - { name: BrakeBiasDec, label: Brake bias down }
  - id: black-box
    title: Black boxes
    tier: should
    place: rim
    role: wheel
    what: >-
      Cycles through iRacing's black boxes: the panels for fuel, tyres, the pit stop, the
      relative gaps and the car's settings.
    when: Before every pit stop, and to check the gaps.
    actions:
      - { name: BlackBoxShowNext, label: Next black box }
      - { name: BlackBoxShowPrev, label: Previous black box }
  - id: headlights
    title: Flash headlights
    tier: should
    place: rim
    role: wheel
    what: Flashes the headlights to tell a slower car you are about to pass.
    when: In traffic, above all in races with more than one class.
    actions:
      - { name: HeadlightFlash, label: Flash headlights }
  - id: push-to-talk
    title: Push to talk
    tier: should
    place: rim
    role: wheel
    what: Opens your microphone on iRacing's voice chat while you hold it.
    when: To talk to your team or the race control.
    actions:
      - { name: VChatPushToTalk, label: Push to talk }
  - id: clutch
    title: Clutch
    tier: nice
    place: rim
    role: pedals
    input: axis
    what: The clutch pedal, for a clean standing start.
    when: Leaving the pits and at a standing start.
    note: Bind it in iRacing if your pedals have a third pedal.
    actions:
      - { name: Clutch, label: Clutch }
  - id: starter
    title: Starter
    tier: nice
    place: panel
    role: panel
    what: Starts the engine again after it stalled, so you can rejoin without a tow.
    when: After a spin that stalls the engine.
    actions:
      - { name: Starter, label: Starter }
  - id: dash-page
    title: Dash pages
    tier: nice
    place: panel
    role: panel
    what: Changes the page of the car's dashboard display, on cars whose dash has pages.
    when: To see lap times, fuel or tyre temperatures on the dash.
    actions:
      - { name: DashPageInc, label: Next dash page }
      - { name: DashPageDec, label: Previous dash page }
  - id: wipers
    title: Wipers
    tier: nice
    place: panel
    role: panel
    what: Wipes the windscreen in the rain, once or all the time.
    when: When it rains.
    need: any
    actions:
      - { name: TriggerWindshieldWipers, label: Wipe once }
      - { name: ToggleWindshieldWipers, label: Wipers on or off }
  - id: look-sideways
    title: Look left and right
    tier: nice
    place: panel
    role: panel
    what: Turns your view to the side while you hold it, to see a car beside you.
    when: On a single screen without head tracking, in close traffic.
    actions:
      - { name: LookLeft, label: Look left }
      - { name: LookRight, label: Look right }
  - id: black-box-values
    title: Change a black box setting
    tier: nice
    place: keyboard
    role: keyboard
    what: >-
      Moves through the lines of the black box on screen and changes a value, such as the fuel
      to add at the next stop.
    when: Before a pit stop.
    note: iRacing's own keys for these are the arrow keys and Space.
    actions:
      - { name: BlackBoxNext, label: Black box next control }
      - { name: BlackBoxPrev, label: Black box previous control }
      - { name: BlackBoxInc, label: Black box value up }
      - { name: BlackBoxDec, label: Black box value down }
  - id: force-feedback
    title: Force feedback strength
    tier: nice
    place: keyboard
    role: keyboard
    what: Makes the force feedback of the wheel stronger or weaker while you drive.
    when: When the wheel feels too light or clips in fast corners.
    actions:
      - { name: IncFFB, label: Force feedback stronger }
      - { name: DecFFB, label: Force feedback weaker }
  - id: text-chat
    title: Text chat
    tier: nice
    place: keyboard
    role: keyboard
    what: Opens the text chat to type a message.
    when: Before the start or after the finish, not while driving.
    actions:
      - { name: TChatInitiate, label: Text chat }
