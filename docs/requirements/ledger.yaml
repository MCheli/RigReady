  - id: OVERLAY-003
    title: "Recent presses: each press with what the game does on it"
    job: fly
    area: overlay
    priority: p2
    done_means:
      - "Each button or hat pressed on any game controller is listed at once: the action as the game names it for the aircraft or car in use, the control ('Button 5', 'Hat 1 up') and the controller, by the name the user gave it or a short form of the name it reports. The newest press is always shown, in the same spot. It works without a drawing of the device (E2E, scenario cheat-sheets-hornet: the stick's trigger, the throttle's speed brake switch, a button of the ICP)."
      - "What is held when the overlay starts is how the rig rests, not a press. A switch or lever that goes through its positions is one line that changes, not a line for each position. The same control pressed again counts up ('×2') instead of adding a line. An axis is never a press. The virtual controller RigReady itself plugged in is not listed."
      - "A control with more than one action shows the one that works on its own first and how many more there are. A press the game has nothing on is listed dimmed as 'Not bound', or left out when the user says so; when the bindings could not be read the line shows the control and the controller and does not claim that nothing is bound."
      - "The page says which setup, game and aircraft or car the names are from, and how the aircraft was picked: the one the user chose for that setup, then one the setup names, then the only one the game has bindings for, otherwise a guess that is said to be a guess. The user can choose another. With no game whose bindings can be read, presses are shown without what they do and the page says why. It reads any game with a binding reader, a racing game too."
    notes:
      - "2026-11-12: done. Built and unit-tested, then seen in the overlay's own window in the app (tests/e2e/overlay.e2e.ts): on the recorded rig the stick's trigger, the throttle's speed brake switch, a button of the ICP and a switch of the R-VPC Panel, by the names the game has for the F/A-18C and, with another aircraft chosen on the page, for the UH-1H; on a PC with no game the control and the controller, with no claim that nothing is bound. The run led to one change: with 'presses the game has nothing on' turned off, a 'Not bound' line that is on the list goes at once instead of staying out its time. A racing game is proved by the unit test only: the list is drawn the same way, and the words are from that game's bindings. Known limits, in the manual where they matter to the user: the first press on a controller that has not reported anything since the overlay started is taken as rest; the same control pressed again after another one is a new line (the list is what happened, in order); bindings changed in the game are read again within about two minutes of a press, or when the page is opened; with no setup and the bindings of several games on the PC no game is guessed, so presses are shown without what they do."
