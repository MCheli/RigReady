  - id: WOW-FLY-006
    title: A quiet suggestion when the gear on the desk is another setup's
    job: fly
    area: fly
    priority: p2
    done_means:
      - "When the setup on screen is missing a device it requires and every device another setup requires is connected, the Play screen offers that setup in one line under the setup's name: 'Wheel connected: switch to iRacing?', with the device that gave it away and how many of this setup's devices are not here, and two buttons, Switch and Not now. It names the kind of device (wheel, pedals, stick, ...), or the device itself when its kind is not known, and the device it names is one the two setups do not share."
      - "It only offers: nothing is switched and nothing runs by itself. Switch goes to the offered setup; Not now is the end of that offer for as long as RigReady runs. Enter on one of its buttons is that button's, not the screen's one action."
      - "Only devices a setup requires count (optional and switched-off items decide nothing; a setup that requires no device is never offered and never contradicted). Of several setups whose devices are all here, the one used most recently is offered. The offer follows the machine: it goes when the device is unplugged and comes back when it is plugged in again."
      - "The device list is read once for all the setups, and nothing but devices is looked at."
    status: done
    evidence:
