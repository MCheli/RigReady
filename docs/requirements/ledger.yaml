  - id: DCS-MON-007
    title: SimAppPro's plan is paired with the monitors by name, shown, and put right before anything is written
    job: configure
    area: dcs-monitors
    priority: p1
    done_means:
      - "Each screen of SimAppPro's plan is paired with a monitor of the layout: first by the side the user's name for a monitor speaks of ('MFD left' for the screen that carries LEFT_MFCD), then by the plan's exact place and size, then the one monitor of that size that is left. Two monitors named for the same side are not guessed between. Only {APPDATA}/SimAppPro/GameExtendDisplay/MFD/DCS_config.json is read."
      - "A pairing is certain only when the name and the plan's place agree, or when the place fits and no other monitor of the layout has that size. The tab lists every pairing with its reason. While one is not certain, 'Use in DCS' is off and says why, until the user has changed the list or pressed 'These are right'."
      - "The user changes a pairing in the list; choosing a monitor another screen of the plan has makes the two change places; the setup, the map and the file preview follow, and nothing is written before 'Use in DCS'."
      - "The stop is in the service, not only in the page: dcs-setup:applyScreens refuses (dcs.screens.pairing) a setup that uses what the last SimAppPro import put on a monitor it was not sure of, unless the call says the user checked the pairing (pairingChecked). The refusal names the displays and monitors in doubt in plain words, and a caller over IPC or the MCP server gets the same text. What the setup in use already has is not asked about again, so Make ready can still put a deleted RigReady.lua back. Applying part of the setup first, or editing it, does not get around the question. dcs-setup:previewScreens hands back the pairing to show (pairingToCheck), and the page asks with it when it is not already asking, for example after another monitor layout was chosen."
      - "Correcting a pairing changes only the pairing. What the user did to the setup since the import stays: a crop the user set goes with its display to the newly paired monitor when the two are the same size, a display the user moved or took off stays where they put it, and aircraft, displays and main screens they added are kept. When the newly paired monitor is another size the crop starts from zero and the list says which display to set again."
      - "Scenario mark-flight, whose plan has the left display where the middle screen is now: with the screens named, RigReady.lua is written with LEFT_MFCD at x = 5128, CENTER_MFCD at 5896 and RIGHT_MFCD at 6664, and the tab says the plan is from before the screens were put in this order. Without names the pairing is by position and the tab says three screens are the same size (E2E, both). A crop top of 240 set on the Left DDI and the AMPCD set to 'Not shown' before a row is changed are still so after it, and the written file has y = 240 (E2E)."
      - "'Identify screens' on the tab shows, on every monitor that is on, its number, its name and what this setup puts on it, and says how many monitors show it."
    notes:
      - "2026-11-12 sitting, finding 16: the import went by position alone and put each display on the wrong screen, because the screens had been put in another order since SimAppPro saved its plan."
      - "The service remembers its last import only while it runs. After a restart the page imports again when no setup is saved, and a setup that is in use needs no question. A scenario run uses the fake overlay port, so what Identify draws on the real screens is proven by the unit test of the requests it makes, not by a picture."
