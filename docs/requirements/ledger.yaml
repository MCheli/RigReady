  - id: WOW-FLY-003
    title: The session - the game running, Welcome back, and a history
    job: fly
    area: fly
    priority: p2
    done_means:
      - "After a launch the Play screen shows the session: which game is running, 'Session in progress since <time>', and a running clock (h:mm:ss, tabular numerals). A game handed to Steam is shown as waited for, and its session begins when the game's own program runs; one that never shows up within fifteen minutes is not a session. While the game runs, Enter starts nothing."
      - "When the game's program is gone (RigReady looks every two seconds), the screen says 'Welcome back' with the setup, how long the session was and when it closed, and Stand down becomes the primary action, on Enter. Dismiss puts the screen back without standing down. Stand down used while the game was still open leaves nothing to offer when it closes."
      - "Stand down runs by itself when the game closes, after a countdown the user can cancel. It is on by default; every setup has its own switch and its own countdown length, one minute by default (the details are WOW-FLY-008). The screen then says what Stand down did, names each step that did not work, or says that it did not finish. A game that closed within two minutes of starting starts no countdown, and the Welcome back line says so."
      - "When nobody is at a RigReady window the same is said as a Windows notification through the Notifications port: 'Welcome back', the setup, the length, and one of: 'Stand down when you are done' (no countdown started), 'Stand down starts in <length>. Open RigReady to cancel.' (a countdown started, and the window is brought back on screen), or what Stand down did. Nobody is at the window when RigReady hid itself after the launch, when the window says it is hidden (tray, minimized), or when nothing was done in it for a minute. While the user is at the window there is no notification."
      - "Every session is recorded in {RIGREADY_HOME}/fly/sessions.json: setup, game, start, length, seconds from opening the setup to every required check being met, what had to be fixed (by Make ready or a fix button), the first required item that was not met, and whether it was launched not ready. A game whose programs RigReady does not know is recorded without a length. A session in progress survives a restart of RigReady: it is picked up when the game still runs, and recorded without a length when it closed meanwhile."
      - "A damaged history file is left exactly as it is and named; the history goes on in the next file (sessions.1.json ...). The newest thousand sessions are kept."
      - "Under the setup's name the screen says 'Last session <today | yesterday | weekday | date>, <length>', or 'No session yet': the same words for every game, with no word of flying, so they read naturally to someone who only races. While a setup's first session is under way the line does not say there was none."
      - "History, from the Play menu: one line of totals ('12 sessions, 14 h; TrackIR needed starting 6 times'), the number of sessions, time in the game, the usual time to ready, how often it was launched not ready, what needed fixing most often, and every session newest first with its length, time to ready, what was fixed and what was not met first."
