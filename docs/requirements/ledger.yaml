  - id: WOW-UI-001
    title: Command palette (Ctrl+K) over every page and the commands of the features
    job: platform
    area: shell
    priority: p2
    done_means:
      - "Ctrl+K, or the button in the header, opens one field that finds every page: each navigation entry and every other route a link can open, read from the feature manifests, so a new feature's pages are in it without an edit (E2E compares the list with the running app's router)."
      - "A feature contributes commands from src/features/<name>/commands.ts (defineCommands), found by import.meta.glob like its manifest; a test feature that is not in src/features proves that no shared file has to be edited, and a module that names another folder, repeats an id or holds a command that does nothing is refused by name."
      - "Matching is fuzzy: the letters typed must appear in order and the reading that keeps them together and at the starts of words counts ('mr' finds Make ready, 'f18' finds F/A-18C); letters scattered inside words find nothing; words typed apart are found in any order in the title, a keyword, the heading or the hint; the letters found are marked in the title."
      - "With nothing typed the commands used last come first, then every other command under its heading (a heading with many shows its first few and counts the rest); with something typed, a command used recently wins a near tie and never a clear one. What was used last is remembered when RigReady is started again."
      - "It is operated by keyboard alone: arrow keys move the mark and go round at the ends, Enter opens or runs, Escape closes and the focus is back on the element that had it; after a page was opened the focus is on that page's heading. It is a combobox with a listbox (aria-activedescendant follows the mark), and it passes the axe scan and the colour-only scan when open, typed into, and with nothing found."
      - "A command that links to the page on screen never drops changes that are not saved on it. A link to the very address on screen leaves the page as it is. A link that opens the page afresh on another address asks first, with the page's own question (the Save bar's 'Leave without saving?', the setup editor's 'Discard your changes?'), and 'Keep editing' leaves everything as it was."
    status: done
    evidence:
