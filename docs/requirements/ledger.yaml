      - "Selecting another profile replaces the checklist and re-runs all checks for that profile without navigating away from the Play screen (E2E screenshot artifacts/screens/fly-switch/)."
      - "Invalid profile files appear in the switcher as disabled entries with the validation error on hover, and cannot be selected."
      - "Switching while checks are still running cancels the in-flight results of the previous profile; no result from the old profile is shown under the new one (unit test with a slow fake ProcessProvider)."
    status: done
    evidence:
      - 'src/features/fly/core/fly.test.ts#streams results of a tagged run, and a newer run silences an older, slower one'
      - 'tests/e2e/fly-depth.e2e.ts#fly: opens on the setup used last, switches in one click, broken files cannot be picked, the choice survives a restart'
      - 'artifacts/screens/fly-switch/02-switcher-open.png'
      - 'artifacts/screens/fly-switch/03-switched.png'

