  - id: NFR-012
    title: Every place that asks a program to close asks all of it together and says why it stayed open
    job: platform
    area: nfr
    priority: p1
    done_means:
      - "One rule in src/core/processes.ts for every place that closes a program: the processes of one program are asked together and the process list afterwards decides, so a helper without a window that is listed first, or one that is gone by its turn, is no failure. It holds for Stand down of the app checks (processes, Stream Deck app, TrackIR), for 'Ask them to close for me' of the backup restore, for the Stream Deck profile restore and for the wheel software restore."
      - "A program that is still running afterwards is named with the reason, in the words Stand down uses: it was asked to close and stayed open (some apps only go to the tray); it has no window to ask; Windows did not let RigReady close it. Where the PC gives no reason, none is made up."
      - "Where the user can let RigReady end the program, that is named as it is on screen, and only where it can still help (not after Windows refused, not when it was already used). Stand down of the Stream Deck app names the setup switch 'Force it closed if it does not close': a new setting of that check, off by default, also in a setup made before it existed. The Stream Deck restore names its button 'End Stream Deck and restore'. Every check that can be told to force keeps the switch under the one name forceClose."
      - "Where nothing can be switched, nothing is pointed at. TrackIR is always ended after the wait, so a TrackIR that is still running is named with the reason and 'Close it yourself.'. The backup restore and the wheel software restore never force: they say 'Close it yourself, then restore again. Nothing was restored.' and restore nothing."
      - "The wheel software restore names the program that is open (the Fanatec App, Logitech G HUB) and shows the reason inside the question, which stays open. After a program stayed open, the button of that question and of the Stream Deck one reads 'Restore again' where RigReady cannot end the program, instead of promising again to close it."
    notes:
      - "2026-11-12: follows FLY-023, which fixed this for the processes check after the sitting. These closers still asked processes of one name one after another, stopped at the first that stayed, and dropped the reason."
      - "2026-11-12: not changed. When a later program of a backup restore stays open, the tools already closed for that restore are not started again."
    status: done
    evidence:
      - "src/core/processes.test.ts#offers force only where it can still help"
