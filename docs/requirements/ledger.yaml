  - id: DISP-010
    title: A layout that is known to work is applied by Make ready and Stand down without the keep question
    job: fly
    area: displays
    priority: p0
    done_means:
      - "When Make ready, 'Make ready and launch' or Stand down applies a monitor layout, it is applied with no 'Keep this monitor layout?' question and no countdown only when that change is known to work on this PC. Every change made by hand (the Monitors page, the command palette, turning a screen) asks every time, and so does a layout that was never kept on this rig."
      - "Known to work means all four of: the same change was applied before (the same monitors asked on or off, at the same places, sizes, rotations and refresh rates, with the same main display); exactly the same monitors are connected as then, and every monitor the change does not mention is on or off as it was then; a person pressed 'Keep it' in RigReady's own window (a keep sent by an assistant, a countdown that ran out and a question that was replaced by a newer change do not count); and the monitors, read back right after that keep, were as asked."
      - "That fact is stored in displays/proven.json in RigReady's data folder and read from disk each time it is needed. A monitor is known by its USB serial when that is unique among the connected monitors (so a USB screen moved to another port is the same monitor), otherwise by its id. A keep by hand on the Monitors page counts for the same change made later by Make ready or Stand down."
      - "In any doubt the question is asked: the file cannot be read or is missing, a monitor the change names is not connected, a monitor that is off would come on at a size the change does not give, another change is still waiting for its answer, or a monitor was unplugged or turned while the question was open."
      - "A layout applied without the question is read back. When Windows refuses it, the step fails with Windows' reason, the monitors are put back, the proof is forgotten and the next time asks. When Windows took it but the monitors are not as asked, the proof is forgotten and the question is asked after all. A layout is never reported as applied when it was not."
      - "The first time, the question says that it is asked once: 'RigReady asks this the first time a layout is used on this PC. Once you keep it, Make ready and Stand down apply it without asking.'"
    notes:
      - "2026-11-12: owner decision after the sitting (finding 48): automatic on Make ready and Stand down, the prompt kept for testing and first setup. The rule lives in src/features/displays/core/proven.ts and LayoutApplier.applyKnown (core/applier.ts); Make ready reaches it through core/layoutCheck.ts and Stand down through core/deskLayout.ts."
    status: done
    evidence:
