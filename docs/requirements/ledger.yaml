  - id: WOW-UI-004
    title: The visual system, refined - depth, type, one focus ring, motion that can be switched off
    job: platform
    area: shell
    priority: p2
    done_means:
      - "The dark theme is kept: every token and shared class the screens are written against is still defined, the surface, text and status colours are unchanged, and no stylesheet or component uses a token that is not defined (a test scans every one)."
      - "Depth has two steps, set by tokens: a panel lies on the page (a faint top light and a short shadow), and what floats above it (dialogs, menus, the palette, toasts) has a firmer edge and a long soft shadow."
      - "Type: Windows' own interface font, a scale of five sizes, and digits of one width everywhere, so counts, times and ids line up. Text for running explanation has its own token, readable on every surface (WCAG AA)."
      - "One focus ring: two pixels of the focus colour on every kind of control, the same on the shell's links, the navigation and a page's buttons (E2E reads it on each)."
      - "Motion is two durations (120 ms, 180 ms) and one easing without overshoot, used for a page arriving, a dialog arriving and leaving, and the shell's own panels and toasts; no component of the shell animates on a number of its own. With 'reduce motion' the tokens are zero and nothing animates (E2E emulates the setting)."
      - "Less motion takes away the time only (0 s, exactly): how often an animation repeats and whether it is held are left as they were, so a component that switches its own motion off finds it off, and a loading bar a dialog keeps in hand stays an animation that never ends instead of one that is held and can never finish. A busy bar that may not travel is drawn whole and dimmed instead of not at all."
      - "The window is dark to its edges: the scrollbar is a thin dark bar, the strip kept free for it continues the header, and a snackbar a feature shows itself looks like the shell's toasts, with its tone as an icon. Because that strip is always kept free, a page has the same width whether or not it is long enough to scroll, and keeps it while a dialog or the palette is open over it."
    status: done
    evidence:
      - "tests/unit/designSystem.test.ts#every token the features use is still there, with the colour it had"
      - "tests/unit/designSystem.test.ts#every shared class is still defined"
      - "tests/unit/designSystem.test.ts#no stylesheet or component uses a token that is not defined"
      - "tests/unit/designSystem.test.ts#depth has two steps: a panel lies on the page, a dialog floats above it"
      - "tests/unit/designSystem.test.ts#the type scale is a scale, and digits have one width"
      - "tests/unit/designSystem.test.ts#the text for running explanation is readable on every surface (WCAG AA)"
      - "tests/unit/designSystem.test.ts#there is one focus ring: two pixels of the focus colour, on every kind of control"
      - "tests/unit/designSystem.test.ts#motion is short and eased out, with no bounce"
      - "tests/unit/designSystem.test.ts#asking Windows for less motion switches it off: the tokens are zero and nothing animates"
      - "tests/unit/designSystem.test.ts#less motion takes away the time only: how often an animation repeats and whether it is held stay as they were"
      - "tests/unit/designSystem.test.ts#no component of the shell animates on a number of its own"
      - "tests/e2e/look.e2e.ts#look: depth, type and motion come from the tokens, and \"reduce motion\" switches motion off"
      - "tests/e2e/look.e2e.ts#look: a snackbar of a feature looks like the shell’s toasts, with its tone as an icon"
      - "tests/e2e/shell.e2e.ts#palette: Ctrl+K finds every page and the commands of the features, by keyboard alone"
