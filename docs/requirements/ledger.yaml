      - "2026-10-03: the first criterion is met. For the second, the packaged smoke runs a real .cmd hidden from the packaged app and counts console windows before and during: none appears. What is missing is the proof that the same measurement would see a window for a script that is not hidden (under the test harness it does not, because the app is started with hidden-by-default windows), and the desktop screenshot the criterion asks for, which is not committed because it would put the owner's desktop in the repository. Needs one look by the owner: run a setup with a hidden script and see that no window flashes."
    status: done
    evidence:
