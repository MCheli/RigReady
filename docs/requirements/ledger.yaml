  - id: FLY-004
    title: Check statuses
    job: fly
    area: fly
    priority: p0
    done_means:
      - "Every item is in exactly one of: checking, passed, failed, warning, error (the check itself could not run, e.g. timeout or provider error)."
      - "Each status has both a distinct icon and colour (passed green, failed red, warning yellow, checking grey spinner, error red outline); status is never conveyed by colour alone."
      - "A check that throws or times out shows 'error' with the reason, not 'passed' and not 'failed' (unit test with a throwing fake provider)."
      - "Each item shows when it was last evaluated; results older than the last refresh are not shown as current."
    status: done
    evidence:
      - 'tests/unit/engine.test.ts#turns unknown types, bad params and throwing checks into errors instead of crashing'
      - 'src/features/fly/core/fly.test.ts#one hung check times out on its own; the others and the verdict do not wait for it'
      - 'tests/e2e/fly.e2e.ts#all good: opens on the setup, every group is green, Ready'
      - 'tests/e2e/fly-depth.e2e.ts#fly: services, config files, scripts and the game version, with instructions, confirmations and Mark verified'
      - 'tests/e2e/fly-depth.e2e.ts#fly: one item is checked again on its own; the others keep their time'
