  - id: PLAT-018
    title: A failure can be explained from the log and from a diagnostics export
    job: platform
    area: platform
    priority: p2
    done_means:
      - "Every channel of every feature that answers with an error leaves one line in the log at the normal level: the channel, the error's code and the message the user was shown. Never the input, and never the error's detail. The same error of the same channel is written once a minute, with a count of the ones in between; the user's own Stop writes nothing."
      - "Every request to an AI provider that fails leaves one line: the host, the path, the model, the HTTP status, the provider's own error type, error code and message, and the id the provider gave the request. Never the key, the request text or an address's query. A send the panel refused is in the log the same way, and so is the case of a question that has used the requests it may make."
      - "The MCP server leaves a line for every change, every launch and every call that did not go through: who, which tool and channel, how it ended and, for a call that did not work, the error's code. Never the input or the answer, nor the call's line in words or its message, which can hold them; those stay in the list of what assistants did."
      - "A diagnostics export of such a failure holds those lines, and holds no API key and no pairing token."
    status: done
    evidence:
      - "tests/unit/failureLog.test.ts#writes the channel, the code and the message, and passes the answer on unchanged"
      - "tests/unit/failureLog.test.ts#never writes what the channel was given, nor the detail of the error"
      - "tests/unit/failureLog.test.ts#writes nothing for an answer that worked, nor for a Stop the user pressed"
      - "tests/unit/failureLog.test.ts#a page that keeps asking fills no log: the same error once a minute, with a count"
