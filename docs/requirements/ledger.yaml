  - id: WOW-TOOLS-005
    title: Learn your controls
    job: configure
    area: cheat-sheet
    priority: p2
    done_means:
      - "Cheat sheets > Learn opens a trainer for the aircraft or car: it names an action in plain language (the name the sheet shows, with the game's own name beside a plainer wording) and the user presses the control for it on the real device. Cards are the actions a button or hat of a connected controller does by itself; with bindings of the user's own, only those. A racing game is asked the same way, and a game with one set of bindings for every car is called by its name."
      - "A press is judged once the control has been held for a moment or tapped: right, with every place the action is bound lit on the picture of the device; or wrong, with what was pressed and what that does, and the right places lit. The picture has nothing written on it while the question is open. 'Show me' gives the answer away and counts as a miss. Letting go of the right control brings the next card; a switch position or a throttle stop is left where it was put (WOW-TOOLS-007)."
      - "A missed card comes back at the end of the round, after every card not asked yet, up to three times in a round, and says 'Asked again: you missed it earlier in this round.' A round ends with how many were right first time and the list of missed ones with where they are, and 'Practise the missed' asks just those."
      - "Progress is kept per aircraft under the data root (cheat-sheets/trainer.json): per action how often it was right and wrong and how many times running; right first time twice running is learned. A round asks what is known least first. A progress file that cannot be read is said and never overwritten."
      - "It runs on live input: the first state a controller reports is where it rests (a switch that is on is not a press). A round can be limited to one device and can be stopped; a PC without a readable game says what is missing."
    notes:
      - "2026-11-12: the second criterion was 'A press is judged at once'. At the owner's sitting a control on its way back from one card was taken for the answer to the next, so a press now has to be held for a moment or tapped (WOW-TOOLS-007). The summary of a finished round also stays on screen when a device is plugged in or taken out; before, it was replaced by the start of a new round."
      - "2026-11-13: a missed card came back three cards later, and as the very next card near the end of a round, which at the owner's second look read as the round starting over (finding T2). It now goes to the end of the round and says that it is asked again."
