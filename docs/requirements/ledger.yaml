  - id: OVERLAY-001
    title: An overlay over the game, off until it is turned on
    job: fly
    area: overlay
    priority: p2
    done_means:
      - "Configure has an 'Overlay' page of its own in the left menu, under Controls. The overlay is off until the user turns on 'Show the overlay': while it is off no window is put over anything and the controllers are not read for it (E2E, scenario cheat-sheets-hornet; and on generic-fresh, where the page names no game and no hardware that is not on that PC)."
      - "Turned on, it stays on: it is up again when RigReady starts, without the page being opened, and gone when it is turned off or RigReady quits. The page says in words whether it is on and over which screen, and when it is on but not showing, why (no screen is on, Windows refused the window, the controllers cannot be read)."
      - "The command palette has 'Turn the overlay on' and 'Turn the overlay off'. Each answers with what happened: a window that could not be shown is not reported as showing."
      - "Its settings are in RigReady's own folder (overlay/settings.json). A damaged settings file is said to be damaged and is not replaced. Nothing in any game is changed."
    notes:
      - "2026-11-12: done. Built and unit-tested on the fake machine, then run in the app with the isolated launch once the sitting was over: tests/e2e/overlay.e2e.ts, its four tests, and only that file, because others were testing on the same PC. What the runs found, fixed in the same commit: after a change that was refused (a damaged settings file) the switch stayed on while the overlay was off, so the page now draws its controls again from what is in effect; with the overlay on and no screen on, the Place row said to turn the overlay on first. So that the page's words for controllers that cannot be read could be seen, the recorded rig's input reader can now be made not to start (the failProvider and hangProvider mutations take the port 'input'; tests/unit/providerFailure.test.ts). A window that Windows refuses is the same line of the page as 'no screen is on' and its words are from the unit tests; a refusal by Windows itself has not been seen. Not run with this feature in at the time (run since, see the note of the same day below): tests/e2e/generic-rig.e2e.ts (it has the 'overlay' page in its list), tests/e2e/tour.e2e.ts, tests/e2e/look.e2e.ts and tests/e2e/a11y.e2e.ts. The tour visits one page more with this one: its pictures after Cheat sheets are renumbered by its first run, so site/screens.json has to follow in the same commit. The navigation had no room for a twentieth entry at the default window size, so its rows went from 30 to 28 px high in src/renderer/layouts/ConfigureLayout.vue: the overlay's first test checks that the navigation does not scroll, and every older picture that shows the navigation is 2 px a row out of date until the whole suite is run. The rule for status colours in tests/e2e/a11y.ts now takes the name of the button an icon is in (the Close of an alert), which the alert about a damaged settings file needed."
      - "2026-11-12, later, two wordings on the page. With the overlay on and the controllers not read, the page now says first what the palette says, 'The overlay is on, but the controllers are not being read', and under it the reader's own message; both take the sentence from one place (NOT_READ in src/features/overlay/core/model.ts). The alert about a damaged settings file now ends with what to do about it, as the manual does: repair the file or delete it, and once it is deleted the overlay starts again from its first settings, turned off. Seen in the app: tests/e2e/overlay.e2e.ts, its third and fourth test, with the pictures overlay-no-game/04-damaged-settings.png and overlay-not-read/01-controllers-not-read.png taken again."
      - "2026-11-12: the four scenario files the shared changes can reach were run one at a time with the feature in, after the merges of main up to a6767a8, and all pass: tests/e2e/a11y.e2e.ts (3 tests), tests/e2e/generic-rig.e2e.ts (3 tests, with one more picture at the end of its flow, artifacts/screens/generic-configure/36-overlay.png), tests/e2e/tour.e2e.ts (4 tests) and tests/e2e/look.e2e.ts (5 tests). The tour walks the navigation in order, so the Overlay page is picture 11 on each of its four rigs (artifacts/screens/tour-flying/11-overlay.png) and the pictures after it carry new numbers; the tour had not been run since the virtual controller joined the navigation, so its two pages are new there too (18 and 36). All four tour folders were taken again and site/screens.json follows the new numbers of the wheel and the monitors. After the merge of the wheel fix the scenario files that read src/features/devices were run as well: tests/e2e/devices.e2e.ts (10 tests), tests/e2e/devices-bindings.e2e.ts (7 tests) and tests/e2e/devices-wheel.e2e.ts (2 tests), all passing. Pictures of other features that differ only by the new navigation entry were left as they are on main."
      - "2026-11-13: quitting while the overlay was still coming up (it reads the screens, the setup and the bindings first; the bindings of DCS can take a quarter of a minute) let what was under way show its window and start listening after the quit, which could start the input reader again after the app had stopped it. Found by the review of 13 Nov, fixed on fix/stand-down-play: once disposed, the overlay shows no window, listens to nothing and takes nothing new; a window that was being shown at that moment is closed. The unit test fails on main at e3974acb."
      - "2026-11-12, the picture of the damaged settings file: it changed on every run, because the page names the file by its whole path and a run keeps its folders in a temp folder with a random name. The page is left as it is: the whole path is how the file is found, and on a user's PC it is short (the data folder, then overlay\\settings.json). The scenario now checks the true text, in what the click answered and in the line that stays, and writes the random folder name as 'rigready-e2e-XXXXXX' only while the picture is taken, then puts it back and checks the text again. Run twice: the picture came out the same both times."
    status: done
    evidence:
