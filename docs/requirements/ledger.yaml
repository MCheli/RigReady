      - "Monitors: one command per saved layout, with how it differs from the monitors now; applying reports the answer to 'Keep this layout?' (kept, or gone back), never 'applied' for a layout that went back; a layout that needs a monitor that is not connected is refused and nothing changes. Identify says how many monitors show their number."
