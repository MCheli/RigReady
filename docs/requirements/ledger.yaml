  - id: FLY-015
    title: Launch target definition
    job: fly
    area: fly
    priority: p0
    done_means:
      - "A profile's launch target is an executable path plus an argument array plus an optional working directory, with path variables resolved at launch (e.g. {DCS_INSTALL}/bin/DCS.exe)."
      - "A launch target can also be a Steam app id (or steam.exe with -applaunch <id>, which is what detection fills in for Steam games); launching hands the game to Steam with an argument array, never a command string, as a detached start that does not wait for Steam to exit."
      - "Unit test: a profile whose argument contains '&& del' is passed to Shell.run as one literal argv element (NFR-008)."
      - "Known games auto-fill the launch target from detection (DCS-001/002, RACE-*-001) and the user can override it."
    notes:
      - "2026-10-03: was 'via Shell.run'. Shell.run waits for the program to exit, and steam.exe stays running; the handoff is a detached start, and 'Launched' means Steam accepted it (FLY-016)."
    status: todo
    evidence: []

