  - id: SEC-003
    title: Archives and YAML from elsewhere cannot hang the app or start something at sign-in
    job: platform
    area: nfr
    priority: p1
    done_means:
      - "YAML read from a file (setups, shared setups, backups) is refused when it stands for more than a million values once its aliases are followed, before anything walks it or writes it out again."
      - "A backup restore never writes into the Start menu, its Startup folder, or the per-user WindowsApps folder, whatever the backup says and whatever is ticked."
      - "Files that start something when opened (.url, .pif, .scf, .appref-ms and the like, besides programs and scripts) are never shared, and are flagged and not pre-ticked in a restore."
    notes:
      - "2026-11-07: found in the security review. Before the fix a 520-byte setup.yaml inside a .rigready file would have made the import write out a billion values; a backup zip could put a .url file into the Startup folder, ticked by default."
    status: done
    evidence:
      - "src/core/files/yaml.test.ts#refuses a document that multiplies itself through aliases, at once"
      - "src/core/files/yaml.test.ts#reads what RigReady writes, and a hand-edited file with anchors"
      - "src/features/sharing/core/sharing.test.ts#rejects a setup whose YAML multiplies itself through aliases, at once and before it is saved"
      - "src/features/backup/core/backup.test.ts#never writes into the Startup folder or the Start menu, and flags launchers that are not programs"

  - id: SEC-004
    title: A Lua file cannot exhaust the app's memory
    job: platform
    area: nfr
    priority: p3
    done_means:
      - "The Lua sandbox stops a chunk that allocates more than a set amount of memory (strings built by concatenation or string.rep included), as it already stops one that runs too long."
    notes:
      - "2026-11-07: found. The sandbox bounded instructions, not memory: 1 GB in 287 ms by doubling a string, string.rep of 1.5 GB accepted."
      - "2026-11-07: done. src/core/lua/memoryGuard.ts refuses an evaluation that holds more than 256 MB, with lua.memory and '<file> used more than 256 MB and was not read.', surfaced the way the instruction limit is. A worker with a heap limit was measured and rejected: Lua strings are Uint8Arrays outside the heap, and a worker capped at 64 MB allocated 2 GB of them. Instead every new Uint8Array is counted while a chunk runs, string.sub/match/find/gmatch count the substrings they copy, table.unpack and string.byte return at most 2,000 values and the stack is held to 2,000 slots (DCS's defaults use about 160), and the hook measures heap plus array buffers every 200 instructions. A chunk that catches the error with pcall stays refused. FA-18C and UH-1H defaults evaluate in the same time within noise (interleaved medians, old/new: 39.0/40.3, 98.1/95.3, 35.6/35.4, 51.4/53.3 ms)."
    status: done
    evidence:
      - "tests/unit/lua.test.ts#refuses a file that builds strings or tables beyond the memory limit, quickly (SEC-004)"
      - "tests/unit/lua.test.ts#evaluates the real F/A-18C and UH-1H joystick defaults from the recorded DCS install"
