  - id: BIND-IRACING-007
    title: Change an iRacing binding from RigReady
    job: configure
    area: iracing-bindings
    priority: p3
    done_means:
      - "RigReady sets one action to one controller button or one key with Shift, Ctrl and Alt, or clears it, and changes only bytes +8 to +67 of that one record: the header, the first two fields of the record, every other record and the end of the file stay byte for byte as they were, and no change gives the same file. It writes only what a file from iRacing shows, and refuses the rest with the reason: an axis, a hat switch, a kind the action does not take, a record or a file it cannot read exactly."
      - "A binding is set by pressing the button or the key, and cleared, for All cars and for a car with custom controls. Before saving, the page shows what the action has now and after, and names every other action the same button or key already does in that set. Save writes only into the file that was shown: when it changed since, nothing is written and the page says to look again."
      - "Every save goes through FileStore: a backup first, one entry on the Safety page, and Undo puts the file back. Saving is refused while iRacingSim64DX11.exe runs, and when RigReady cannot tell whether it runs, and the page says why before saving."
      - "A change goes into the file iRacing reads: on iRacing 2026 Season 3 and later the control profile app.ini names (BIND-IRACING-009), never the older Documents/iRacing/controls.cfg beside it."
      - "A controls.cfg in which RigReady changed one button and one key is accepted by iRacing: both show in iRacing's Options > Controls, every other binding and setting is as before, and the file iRacing saves afterwards differs from the file before only in those two actions, each as RigReady wrote it (rig evidence, owner present; the steps are 'The second look' in docs/research/iracing-bindings.md)."
      - "A controls.cfg that iRacing itself wrote for a car with custom controls has been read byte for byte, and a change RigReady made to it is accepted by iRacing (rig evidence, owner present)."
      - "Until the two rig points hold, changing a binding is off: it is on only when RigReady starts with RIGREADY_IRACING_EDIT=1 in its environment, and otherwise nothing of it can be reached (BIND-IRACING-006)."
    notes:
      - "2026-11-12: first note, when this was not started. The read and write round trip of the owner's real file is byte for byte identical (BIND-IRACING-001), but that only proves the reader loses nothing. The layout comes from one file from one rig with one bound controller; the header settings, the first field of each record, three bits of the mask and the last two bytes are not understood; a hat switch binding and a real per-car file have never been seen; and no file changed by RigReady has been opened by iRacing, because no game may be started on the rig in this round. iRacing's own advice for a file it does not like is to delete it and bind everything again."
      - "2026-11-12, later: the writer, the review, the save through FileStore and the edit screen are built and tested, behind a switch that is off (points 1, 2, 3 and 6; the evidence below). in_progress, not done: points 4 and 5 are open. No file changed by RigReady has been loaded by iRacing. tests/rig/iracingBindingsEdit.rig.test.ts is written and has NOT been run; its two steps go with the six steps of 'The second look'. No car on the owner's PC has custom controls, so per-car changes rest on the made-up car file of the scenario tests. A button of a controller the file does not name yet is written like one it does name, which is a guess until iRacing has loaded such a file. Axes and hat switches are not part of this requirement: BIND-IRACING-008."
      - "2026-11-13: review L8 and L6. Save worked the change out again from the file as it was then, so the 'now' and the conflicts the user approved could be another file's: the preview now carries the file's SHA-256 (seen), and Save writes nothing when the file is no longer that one, and says to look again. A listen cut short (Clear, Close) while the controllers were still starting went on in main and could still take a key in the window: main now drops a start that a stop overtook, and the dialog's listen takes no key or press once it was cut short. Both unit tests failed before the fix. The window half of L6 has no test of its own: there is no component test harness, and the fake input reader cannot be made to start slowly and then answer (hangProvider never answers)."
      - "2026-11-13, rig test (sitting log 11:05 to 11:35; beta.5 with the switch on, the owner's real files): RigReady bound Flash headlights to button 8 of the wheel base and Black box show next to Shift+J. In a test drive button 8 flashed the headlights; Shift+J did nothing and iRacing's Options > Controls showed the action unassigned. The 'after' rig step passed (only those two records differed, each as RigReady writes it; iRacing did not rewrite the file on close) and Undo on the Safety page put the file back byte for byte. It proved nothing about point 5: iRacing had updated itself to 2026.11.02.01 that morning, made the control profile profiles/controls/Baseline on its first run (10:45) and reads that, while RigReady wrote the older Documents/iRacing/controls.cfg. Button 8 flashes the headlights after Undo too, with neither file binding it, so the button's effect came from outside iRacing's control files; the key failing is what reading the profile predicts. The key record has exactly the form of iRacing's own Shift records, and 0x4a is J (docs/research/iracing-bindings.md, 'The rig test of 13 Nov 2026'). What the rig test did prove: Undo on the Safety page restores an iRacing bindings file byte for byte."
      - "2026-11-13, later: the change now goes into the control profile (point 4, the tests below), and the rig test copies app.ini and the profiles and keeps the profile file for its 'after' step. The switch stays off until 'The second look' passes on the profile. Points 5 and 6 stay open; buttons and keys are both unproven in iRacing."
    status: in_progress
