      - "src/features/dcs-setup/core/screenNames.test.ts#writes a name with quotes in it as text, and the file still reads as plain data"
      - "tests/e2e/dcs-screens.e2e.ts#dcs-screens: an aircraft or a display RigReady did not find is added by name, a name that cannot be one is refused with the reason, and the tab says what it knows"
