  # ---------------------------------------------------------------------------
  # THE BUILT-IN ASSISTANT: app-wide, on the MCP catalogue and gate
  # ---------------------------------------------------------------------------

  - id: ASSIST-001
    title: The built-in assistant, app-wide, on the same tools and gate as the MCP server
    job: configure
    area: ai
    priority: p2
    done_means:
      - "With an AI provider set up (a key, or a server on this PC), an Assistant button is in the app bar on every screen and 'Open the assistant' is in the command palette; without one there is no button and the palette opens the panel and says a provider is needed; drafts from MCP assistants are shown either way. The binding guide keeps its own view and links to the panel."
      - "The assistant is offered the MCP server's guided catalogue (task-level tools, rigready_channels, rigready_call), never an 'off' channel, and every call goes through the one gate the MCP server uses: confirm policy, question in the window under 'Built-in assistant', one change at a time, rate limit, activity record and the Safety page name."
      - "Every request is built first and shown (a line per part, the exact JSON a click away); nothing is sent before Send, or before the user ticked 'Don't show this again for this conversation'. The key goes only in the request header to the one host the preview named; tool answers have the user's folder written as {USER} however it is written there: in any case, with either slash or doubled in JSON, in its short (8.3) form, without its drive, and in a file:/// address with escaped characters, in any script. Only the whole folder is taken: other names and paths go as they are, and the PC's name is written as {PC} in any case."
    notes:
