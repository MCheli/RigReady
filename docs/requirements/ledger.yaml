  - id: NFR-008
    title: Missing and odd files handled gracefully
    job: platform
    area: nfr
    priority: p1
    done_means:
      - "Every reader (profiles, Lua, JSON, INI, YAML, VDF) returns a Result error for missing, empty, locked, non-UTF-8 and BOM-prefixed files; fuzz-style tests feed each reader these cases and none throws."
      - "A game whose folders were deleted shows 'not found' in the UI rather than crashing the page."
    notes:
      - "2026-10-03: 'locked' is simulated at the file port (reads or writes fail with EBUSY), because Node always opens files shared on Windows and cannot hold one exclusively. Beyond the criterion: a damaged store is never overwritten without the old file being kept (settings and monitor layouts are set aside byte for byte, everything else is left in place and reported), the journal survives a cut-off line, readers have size caps, and a file that is not UTF-8 is never rewritten from its lossy text. Two parsers (VDF, BeamNG's relaxed JSON) report damage by throwing an Error that their callers turn into a Result; the fuzz tests hold them to that. Steam games detected only by their app manifest (Assetto Corsa EVO and Rally, MSFS 2024) are still listed when their folder is deleted by hand while Steam's manifest remains, as Steam itself does."
    status: done
    evidence:
      - "tests/unit/fuzzParsers.test.ts#huge and deeply nested content is refused or read quickly, never a stack overflow or a hang"
      - "tests/unit/fuzzParsers.test.ts#profile YAML: every damaged form is a parse error or a value, never a crash of the YAML reader"
      - "tests/unit/fuzzParsers.test.ts#a zip is checked before it is unpacked: a bomb, a path outside the folder and a cut-off archive are refused"
      - "tests/unit/fuzzStores.test.ts#every damaged form: the app gets settings, and the old file is kept byte for byte"
      - "tests/unit/fuzzStores.test.ts#every damaged form of one setup: it is listed as unreadable, the others still load, and its file is untouched"
      - "tests/unit/fuzzStores.test.ts#every damaged form: reading says so and changes nothing; recovery keeps the file aside and starts empty"
      - "tests/unit/fuzzStores.test.ts#every damaged form: an error result, and an update never overwrites the damaged file"
      - "tests/unit/fuzzStores.test.ts#every damaged form: the readable entries are listed, new changes are recorded, and no line is lost"
      - "tests/unit/fuzzStores.test.ts#a line cut off by a crash: the entries before it survive and the next entry is not glued to it"
      - "tests/unit/fuzzStores.test.ts#locked: reading says so, and a file is not changed when the change cannot be journaled"
      - "tests/unit/fuzzStores.test.ts#a file that is not UTF-8 is never rewritten from its lossy text"
      - "tests/unit/fuzzStores.test.ts#garbage in every data file: each is named, kept, and the app has something to work with"
      - "tests/unit/fuzzApp.test.ts#every file locked (reads fail with EBUSY at the file port): every request still comes back as a value"
      - "tests/unit/fuzzApp.test.ts#every file gone, and then every folder: \"not found\" answers, never a crash"
