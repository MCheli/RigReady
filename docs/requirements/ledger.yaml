      - "Every change is shown first (the file and where it goes) and written through FileStore: one journaled action with a reason, a copy of whatever was replaced, Undo on the Safety page. A file that merely has the name is never removed."
      - "Success is reported only after the link was read back and starts this RigReady with this setup: under sabotage (the file written and put back, a link to another program handed back) the answer is an error."
      - "Started with its own arguments, the shortcut flies the setup (E2E: a second start with the arguments of the link that was made runs the fix and launches)."
      - "Through a Shortcuts port: Electron's shell.writeShortcutLink / readShortcutLink in the app, a recording fake in scenario runs. Arguments are a list of values, turned into the one text a shortcut stores by Windows' own quoting rules (unit tests, including a real program started with that text)."
      - "Deleting a setup on the Setups page removes its desktop shortcut (under its current name or an earlier one) and then the setup file under one journal group, 'Delete setup \"<name>\"', so one Undo on the Safety page brings both back; the delete dialog and the message afterwards say so, and a shortcut that is still there afterwards is an error that leaves the setup alone. The uninstaller removes every '<setup> - RigReady.lnk' on the desktop; the installer smoke's test variant looks for another ending and never touches a real one, and a unit test keeps the NSIS ending equal to the app's SHORTCUT_SUFFIX."
