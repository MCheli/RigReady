  - id: WOW-FLY-008
    title: Stand down by itself when the game closes - a switch and a countdown for every setup
    job: fly
    area: fly
    priority: p1
    done_means:
      - "Every setup has its own switch 'Stand down when the game closes' (on by default) and its own countdown length (one minute by default; the editor offers 10 seconds to 10 minutes, the setup file takes 5 to 3600 seconds). Both are in the setup editor under 'When the game closes' and in the setup file under extensions.fly (standDownOnClose, standDownAfterSeconds). A setup saved before this existed gets the defaults, and so does a value a hand edit got wrong."
      - "When the game the setup started has closed and the switch is on, a countdown starts. It is visible wherever the user is: a notice at the bottom right of every page of the main window ('Stand down in 42 seconds', one sentence that says what will happen, Cancel, and 'Change this for the setup'), the Welcome back line of the Play screen, and the session line of the compact view with its own Cancel. When nobody is at a RigReady window, Windows says 'Stand down starts in <length>. Open RigReady to cancel.' and the window is brought back on screen."
      - "The notice lies over the bottom right corner of the page, where a page may have buttons of its own (the setup editor's Save and Cancel). While it counts it can be moved to the top bar: the countdown, as a clock that is never cut short ('Stand down in 4:05'), and its Cancel are then in the bar on every page and cover nothing, and pressing the countdown there brings the notice back. What Stand down did is always said in the notice."
      - "An editor with the shared Save bar along the bottom of the window (the virtual controller's) is never covered: the notice stands above that bar in every state, counting, standing down or showing the result, so Save and Back can always be pressed."
      - "When the time is up the same Stand down the button runs is run, once. The notice and the Welcome back line then say what it did: 'Stood down' with its summary only when every step worked; 'Stand down ran, but N step(s) need(s) attention' with each step that did not work; 'Stand down did not finish' with the reason when it could not run. The result stays until the user presses OK. With nobody at a window the same is a Windows notification."
      - "Cancel ends the countdown: nothing is closed, the screen says 'Stand down was cancelled. Nothing was closed.', and Stand down stays the primary action. Cancel pressed after Stand down has started changes nothing, and the answer says so."
      - "The game running again during the countdown ends the countdown, closes nothing, and is a new session. Every program name known for the game is watched, so a launcher that exits while the real game runs does not end the session."
      - "A game that closes within two minutes of starting starts no countdown. The screen says why, and Stand down is still there to press."
      - "The compact view keeps to its small window: 'Welcome back', how long the session was and the Stand down line are three lines that are on screen without scrolling, at the window size a user may have kept from before. A reason too long for one line there has a short form ('It closed too soon: Stand down did not start.') with the full sentence as its tooltip."
      - "Stand down pressed by hand during the countdown ends the countdown and runs once; a second Stand down while one is running is refused. Dismiss, or a new launch, during the countdown stands nothing down."
      - "Launch, Make ready and a fix end the countdown the moment they are pressed, before they start anything, and the screen says 'Stand down was cancelled. Nothing was closed.' until the game is up. A launch that takes longer than what is left of the countdown has nothing closed under it. A check does not end the countdown: the Play screen checks again by itself every few seconds, and a check changes nothing. Launch, Make ready and a fix asked for while a Stand down runs (from the tray, a shortcut or an assistant) are refused with 'Stand down is running.' and change nothing."
      - "Stand down pressed by hand with 'close the game', or a game the user closes while a Stand down pressed by hand runs, starts no countdown under it: the session is in the history with its length, there is nothing more to offer, the window is not brought up, and Windows is told nothing more. The Stand down that was pressed reports as it always does."
      - "RigReady quit during the countdown stands nothing down, then or at the next start, and nothing says it did. A window that is only hidden in the tray is not a quit: the countdown goes on."
      - "When the running programs cannot be read at the end of the countdown, Stand down waits for a look that works."
      - "With the switch off, the game closing is 'Welcome back' and nothing is closed by itself, however long it is left."
    notes:
      - "2026-11-12: the owner's decision: on by default, a switch and a countdown length for every setup, a countdown that can be cancelled. It replaces the Play-menu setting of WOW-FLY-003, which was off by default and had no countdown. A fly/preferences.json from before still reads; its autoStandDown is ignored."
      - "2026-11-12: known limits. With nobody at the PC, a desk layout applied by Stand down still asks 'Keep this monitor layout?'; unanswered, the layout goes back and the step is listed as not done. A launcher under a name RigReady does not know that stays open for more than two minutes cannot be told apart from the game closing."
      - "2026-11-13: two faults found by the review of 13 Nov, fixed on fix/stand-down-play. (1) Play ended the countdown only once the game was up (SessionTracker.launched), so a countdown with less time left than the actions before the launch and the game's start took ran out in the middle of the launch: Stand down closed the helper apps the launch had just started, and its result was then dropped. The countdown now ends at the start of Fly.launch, Fly.makeReady and Fly.fix (SessionTracker.gettingReady), and those three are refused while a Stand down runs, which the Play screen's busy state already did for its own buttons but the tray, the Jump List and the assistants did not. (2) A Stand down pressed by hand with 'close the game' closed the game partway through, and the watch loop then started a second, automatic countdown under it: the window came up, and with a short countdown the second one was refused and said 'Stand down did not finish: Stand down is already running.' while the first said 'Closed 2 apps'. A Stand down pressed by hand now holds the countdown off from its start to its end (standDownStarted, standDownEnded). The four unit tests and the two scenario tests added for this fail on main at e3974acb and pass with the fix."
    status: done
    evidence:
      - "src/core/profile/standDownOnClose.test.ts#a setup saved before this existed gets the defaults: on, one minute"
