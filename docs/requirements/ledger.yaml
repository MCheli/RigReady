  - id: DCS-MON-011
    title: An aircraft or a display RigReady did not find is added by name on the Screens tab
    job: configure
    area: dcs-monitors
    priority: p1
    done_means:
      - "'+ Aircraft' has three parts: the installed aircraft with the displays RigReady found for them; under 'No display found in their files', the installed aircraft where it found none; and 'Another aircraft, by name', which stays in view while the list scrolls. An aircraft already in the setup is not offered again."
      - "'Another aircraft, by name' takes the name DCS has for the aircraft. A name an installed aircraft has, whatever capitals were typed, adds that aircraft with what RigReady knows of it, and the box says which one. Any other name is added as typed. 'Display by name' adds a row to the aircraft in view, which is placed and cropped like any other; the cross on the row takes the name off the list and out of the file."
      - "The tab says what RigReady knows and no more. The heading and the empty text say no display was found, not that the aircraft has none. A row for a name RigReady has not seen shows the name as typed and says: 'RigReady has not seen this name in this aircraft's files. If the aircraft does not ask DCS for it, nothing is drawn there.' An aircraft that is not installed where RigReady looks carries: 'RigReady has not found an aircraft called <name> in DCS on this PC. It cannot check this name, or any display you add for it.' The footnote says a name is written as typed and cannot be checked against the game."
      - "Only what can be a name is taken. A display name: letters, digits and _, starting with a letter or _, at most 64 characters, and not a word of the Lua language, a name the monitor setup file uses itself, or DCS's name for the main view. An aircraft name: letters, digits, spaces and _ . + -, starting with a letter or a digit, at most 64 characters. The name shown for an aircraft is one line of plain text, at most 60 characters; an aircraft added by a longer DCS name is shown under its first 60. Anything else is refused with the reason in plain words: in the box, where 'Add' stays off, and in the service for a caller over IPC or the MCP server."
      - "The file writer holds the rule itself: generateSetup leaves out every name that fails it and reports an error, dcs-setup:applyScreens writes nothing while the preview has an error, and text that is not a name (the name shown, the monitor names) is written on one line inside a comment or a quoted string whatever it holds. With names that are not only names, the generated file is the same, byte for byte, as without them (unit). What an aircraft's files or SimAppPro's plan name is held to the same rule when it is read."
      - "A setup with an added aircraft and added displays is written to Saved Games/DCS/Config/MonitorSetup/RigReady.lua through FileStore, one backup group, with each name as typed under its aircraft, and is there again when the tab is reopened (unit and E2E)."
    notes:
      - "2026-11-12, the audit of fixed lists, item 3 and block 24: an aircraft the scan missed could not be added, and the footnote read as if it had no displays."
      - "RigReady cannot know whether an added name is right: that shows only in the game. Not checked in the game."
      - "The list of monitor setup files further down the tab still shows only names in capital letters as a file's displays; a name added in other letters is written and placed, but not listed there."
      - "2026-11-13: review L7. An aircraft typed by a DCS name of 61 to 64 characters was added with that name as its shown name too, over the 60 the setup takes, and every later preview and apply then failed IPC validation until it was removed. It now gets its first 60 characters as its shown name, and so does one read from a file without a name of its own. The unit test failed before the fix."
    status: done
    evidence:
      - "src/features/dcs-setup/core/screenNames.test.ts#an aircraft typed by a DCS name of up to 64 characters makes a setup that can be sent and saved"
      - "src/features/dcs-setup/core/screenNames.test.ts#takes the names DCS aircraft use for their displays"
      - "src/features/dcs-setup/core/screenNames.test.ts#refuses any other display name, and says why in plain words"
      - "src/features/dcs-setup/core/screenNames.test.ts#takes the names DCS has for aircraft, and refuses anything else"
      - "src/features/dcs-setup/core/screenNames.test.ts#wants the name shown for an aircraft to be one short line"
      - "src/features/dcs-setup/core/screenNames.test.ts#does not list a name out of an aircraft file that the setup file could not carry"
      - "src/features/dcs-setup/core/screenNames.test.ts#is offered for every installed aircraft, with or without displays found in its files"
      - "src/features/dcs-setup/core/screenNames.test.ts#is written as typed, through the file store, when it can only be a name"
      - "src/features/dcs-setup/core/screenNames.test.ts#is refused with the reason, and nothing is written, when it has any other character"
      - "src/features/dcs-setup/core/screenNames.test.ts#is refused with the reason, and nothing is written, when the file already uses the word"
      - "src/features/dcs-setup/core/screenNames.test.ts#is refused, and nothing is written, when the name shown for the aircraft has a line break"
