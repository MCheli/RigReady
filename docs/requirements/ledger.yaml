# RigReady requirements ledger.
# Source of truth for scope: docs/PRODUCT.md. Schema: docs/ARCHITECTURE.md "Requirements ledger".
# Every entry starts as status: todo with no evidence. An entry becomes done only with evidence:
# an automated test id exercising the real code path and, for anything visible, a screenshot
# under artifacts/screens/<flow>/ from a scenario run.
#
# Conventions used in done_means:
#   fixture  = fixtures/rigs/<name>/. The one that exists is mark-full, recorded from the owner's rig
#              with everything connected; where an entry says mark-flight or mark-racing, use mark-full
#              with mutations. generic-rig (a second, non-WinWing rig used to prove nothing is
#              hardcoded) has not been recorded yet.
#   scenario = RIGREADY_SCENARIO run on fake providers: <fixture> + <mutation>, e.g.
#              mark-full + pedals unplugged (fixtures/scenarios/flying-pedals-unplugged.yaml)
#   Paths use path variables ({DCS_USER}, {DOCUMENTS}, {RIGREADY_HOME}, ...) and forward slashes.

requirements:

  # ---------------------------------------------------------------------------
  # FLY MODE — the daily loop
  # ---------------------------------------------------------------------------

  - id: FLY-001
    title: Open on the last-used profile
    job: fly
    area: fly
    priority: p0
    done_means:
      - "With profiles 'DCS F/A-18C' and 'DCS UH-1H' in the data root and 'DCS UH-1H' used last, starting the app shows the Fly screen with 'DCS UH-1H' as the active profile name (E2E, scenario mark-flight)."
      - "The last-used profile id survives an app restart: launch, switch to 'DCS F/A-18C', quit, relaunch; the Fly screen shows 'DCS F/A-18C'."
      - "If the last-used profile file was deleted or fails validation, the app opens on the most recently modified valid profile and shows a one-line notice naming the missing profile; it does not show an empty or crashed screen."
      - "With zero profiles, the Fly screen shows an empty state with a single 'Create a setup from this rig' action (see CFG-PROFILE-001) instead of a checklist."
    status: done
    evidence:
      - 'src/features/fly/core/fly.test.ts#opens on the last used setup and draws its checklist before checking'
      - 'src/features/fly/core/fly.test.ts#falls back to the most recently changed setup, with a one-line notice, when the last one is gone or broken'
      - 'src/features/fly/core/fly.test.ts#with no setups there is nothing active'
      - 'tests/e2e/fly-depth.e2e.ts#fly: opens on the setup used last, switches in one click, broken files cannot be picked, the choice survives a restart'
      - 'tests/e2e/fly-depth.e2e.ts#fly: when the setup used last no longer opens, it opens on another with a one-line notice'
      - 'tests/e2e/capture.e2e.ts#a new rig: capture the current state into a setup, which is then Ready'
      - 'artifacts/screens/fly-switch/01-uh-1h.png'
      - 'artifacts/screens/fly-fallback/01-fallback.png'
      - 'artifacts/screens/profile-capture/01-empty.png'

