      - 'tests/e2e/fly.e2e.ts#pedals unplugged: red, no fix available, Launch warns but is not blocked'
      - 'tests/e2e/fly.e2e.ts#optional device missing: yellow, never red, Ready with warnings; Launch goes straight through'
      - 'artifacts/screens/fly-optional-missing/01-ready-with-warning.png'
      - 'artifacts/screens/fly-pedals-unplugged/01-not-ready.png'

