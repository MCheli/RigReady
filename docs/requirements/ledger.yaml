  - id: WOW-WIN-001
    title: Start RigReady to fly (--launch, --make-ready, --setup)
    job: fly
    area: one-click
    priority: p2
    done_means:
      - "RigReady.exe --launch \"<setup id or name>\" on a cold start checks the setup, runs every available fix in Make ready order and launches the game; --make-ready stops before launching; --setup only makes it the setup in use. It goes through the same IPC handlers the Play screen and the tray use (E2E on scenario one-click-fly: the monitor layout is applied and still asks 'Keep this layout?', TrackIR is started before the game)."
      - "The game is started only when every required item is met: with the pedals unplugged --launch stops with the window in front, one line per unmet item on it, and no program started. A fix that fails, a layout that is not kept and a step before launch that must not fail stop it the same way."
      - "An unknown setup, a name two setups share and a flag without a setup open the window and say so, naming the setups there are; nothing is checked or started."
      - "The window shows the command on every screen while it runs (what it is doing, which fix, how many of how many) and how it ended; 'Do not launch' keeps a --launch command that is still checking or making ready from starting the game."
      - "The arguments are read by a pure function with unit tests: --launch \"<setup>\" and --launch=<setup>, other switches left alone, a missing setup or two actions reported in words."
    notes:
      - "2026-10-04: decisions. (1) Fixes that run a program the user must confirm are not run, as from the tray: nobody is asked from a shortcut, so such an item stays unmet and the command stops and says so. (2) Optional items never stop it; when some are not met the result names them and is amber. (3) Make ready is skipped when the check finds nothing to fix, so a ready rig launches at once. (4) 'Do not launch' cannot interrupt a fix that is running (neither can the Play screen): it lets Make ready finish and then does not launch, and says exactly that. (5) A setup with nothing to launch is made ready and the command says there is nothing to launch."
