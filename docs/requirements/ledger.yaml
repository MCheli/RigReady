    title: "My own photo: press a control, click its place"
    job: configure
    area: cheat-sheet
    priority: p1
    done_means:
      - "'Use my photo' over the sheet of a device with no drawing (and 'Make a drawing from a photo' in the layout editor, 'Use my own photos' in the drawing editor) asks for a photo and opens it for placing. No button number is typed anywhere."
      - "The user presses a control on the device and the page names it ('Button 5: click where it is on the photo.'); a click on the photo places it there. Moving an axis far enough does the same for the axis."
