  - id: CFG-PROFILE-006
    title: Edit profile basics and launch
    job: configure
    area: profiles
    priority: p0
    done_means:
      - "The profile editor changes name, description, game, install choice, launch target (executable, arguments list, working directory). The monitor layout a setup uses is its Monitors check, edited like any other check; the desk layout Stand down returns to is an app setting (Settings)."
      - "Changes are saved only on Save; Cancel leaves the file byte-identical (unit test compares file hashes)."
      - "Renaming a profile keeps its id stable, so last-used and backups still reference it."
      - "Save takes the user to the list of setups only while they are still in the editor: a save that answers after they went on to another page (Play) leaves them there, and that page follows the saved setup (scenario with the save slowed by slowFiles)."
      - "When the address changes to another setup while the editor is open (the Stand down notice's 'Change this for the setup', the assistant's 'Open setup'), the editor reads and shows that setup. When the one on screen has changes that are not saved, it asks first and names it, and 'Keep editing' stays with them."
      - "Every other way out of the editor with changes that are not saved asks first too, by the rule of the Save bar on the other editors: the menu on the left, Play, a link on the page. 'Discard' goes where the user was going and leaves the setup file byte for byte as it was; 'Keep editing' stays with the changes. A change that is already in a save under way is not asked about: that save goes on. Agreeing once is not agreeing for good: the next way out with a new change asks again."
    notes:
      - "2026-10-03: the layout sentence corrected to the architecture: a setup has no layout field of its own; its layout is the display.layout check item (by layout name), and the desk layout is settings.deskLayoutId."
      - "2026-11-12: a save that answered after the user had opened Play took them back to the Setups list. On GitHub's slower runners this failed integration.e2e.ts (install choice) now and then, always with the Setups list on screen. ProfileEditPage now moves only a user still in the editor, and the scenario slows the save on purpose."
      - "2026-11-13: review M6. The editor read its setup only when it opened, so a move from one setup to another kept the first one's draft on screen while Open file, Show file, the shortcut and the copy list used the second one's id. The scenario step failed before the fix: the address named the F/A-18C and the editor showed the UH-1H. The assistant's 'Open setup' takes the same way in and has no scenario step of its own. A change made while a save runs now also stays on screen, still unsaved, as in VPAD-007; no scenario step covers that in this editor yet."
      - "2026-11-13: review, older than tonight (medium): only the editor's own Cancel asked, so the menu, Play and the palette dropped unsaved edits without a word; #94 had left this editor out of the Save bar's rule. The editor keeps its own question ('Discard your changes?', with a third wording for the way out) and now has a leave guard of its own, with the way out the user agreed to held by the shared wayOut of src/renderer/unsaved.ts, which the Save bar uses too. Without the guard the scenario step cannot pass: the menu left the editor with no question."
    status: done
    evidence:
      - "tests/e2e/profiles.e2e.ts#setups: name, notes, install, and what Launch starts are edited; Cancel leaves the file as it was; a rename keeps the id"
      - "tests/e2e/profiles.e2e.ts#setups: leaving the editor by the menu or by Play with unsaved changes asks first; Keep editing keeps them"
      - "src/renderer/unsaved.test.ts#is let through, a redirect on the way included, and asks nothing"
