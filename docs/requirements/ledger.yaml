  - id: WOW-FLY-004
    title: The rig at a glance - monitors to scale and devices as chips
    job: fly
    area: fly
    priority: p2
    done_means:
      - "Under the top of the Play screen a strip draws every monitor that is on, to scale and in its place (one scale for both directions), with the main display outlined; monitors that are off are named under the drawing. The monitors are read through the display port, named as the checklist names them (the owner's name, or the monitor's own, numbered when several share it)."
      - "While the setup's monitor check is not met, the monitor that differs is drawn with a dashed outline and a named sign, and what differs is said in words under the drawing ('USB_Monitor (2 of 3): rotated 0°, expected 90°'; '...: not connected' for one that is unplugged). A saved layout the check names is what the monitors are compared with, as for the check itself. A setup that expects nothing of the monitors shows them with nothing marked. When Windows does not report the monitors, the strip says why."
      - "The setup's device items are chips: an icon by kind of device (stick, throttle, pedals, wheel, display unit, panel, head tracker, button deck, ...), the name (without the maker most of them share; the whole name and what the check found are in the tooltip), and a state icon with a name. A chip that is not met has its own outline as well as its icon."
      - "Choosing a monitor or a device opens its checklist group if it is folded, brings its row into view, tints it for a moment and puts the keyboard focus on it."
      - "The drawing follows the machine: after a fix or a change of the monitors it is read again."
    status: done
