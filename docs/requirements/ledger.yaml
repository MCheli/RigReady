      - "Scenario mark-flight + streamdeck-not-running (Stream Deck marked optional) shows the Stream Deck item yellow and the banner 'Ready with warnings (1)', never 'Not ready'."
      - "Scenario mark-flight + pedals-unplugged (pedals required) shows the banner 'Not ready (1)'."
    status: done
    evidence:
