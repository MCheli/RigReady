  - id: DISP-021
    title: Stand down by itself warns when its desk layout has not been kept with these monitors, and Replace counts as kept
    job: fly
    area: displays
    priority: p1
    done_means:
      - "While the countdown before a Stand down by itself runs, its notice says when the desk layout has not been kept with the monitors connected now, so Stand down will ask 'Keep this monitor layout?': 'The desk layout \"Desk\" has not been kept with these monitors yet. Stay and press Keep it when RigReady asks, or the monitors stay as they are.' The Windows notification for a countdown nobody is watching says the same. Nothing is said when the layout is known to work, when there is nothing to change, or when the step will fail and say why. Working it out never holds the countdown up for more than three seconds."
      - "The question is never skipped because nobody is there: a desk layout that was not kept still goes back when its countdown runs out."
      - "When it goes back, the Stand down result says what to do next time in one sentence: 'Desk monitor layout: The new monitor layout was not kept, so the previous one is back. Next time, stay for the question and press Keep it.'"
      - "'Replace with the monitors as they are now' records the layout as kept for the monitors connected at that moment, by the rule of DISP-010 (src/features/displays/core/proven.ts explains how each of its four points is met): the same targets Make ready and Stand down would apply, the same monitors, a person in RigReady's window, and a read-back after saving that finds the monitors exactly as the layout says. It does not count for an assistant, while a keep question is open, or when the monitors changed or cannot be read; a layout replaced with some monitors connected is still asked about with others."
      - "Make ready shows no countdown or notice of its own before it applies a layout: a person pressed it, and its keep question already says it is asked once."
    notes:
      - "2026-11-13: second look on the rig, finding SD1. Desk was replaced with the MFD screens connected; after the swap to the racing gear (MFD screens unplugged) the Stand down after iRacing closed asked about Desk with nobody there, and Desk went back. The rule stays: a layout nobody saw is undone. The countdown's line comes from an optional StandDownStep.needsYou (src/core/checks/registry.ts), which the displays feature's desk step answers through LayoutApplier.wouldAsk."
    status: done
    evidence:
      - "src/features/fly/core/sessions.test.ts#says, with the countdown and in Windows, when the desk layout has not been kept with these monitors yet; once kept it says nothing"
      - "src/features/fly/core/sessions.test.ts#a Stand down nobody stayed for: the desk layout goes back, and the result says what to do next time"
