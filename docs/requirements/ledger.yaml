  - id: OVERLAY-005
    title: "Placing the overlay: which screen, and where on it"
    job: configure
    area: overlay
    priority: p2
    done_means:
      - "'Screen' offers the monitors that are on, the main one first, and the overlay goes to the one chosen. 'Place' has nine spots (the corners, the edges, the middle) and the overlay goes to the one clicked (E2E)."
      - "'Move it on screen' frames the overlay where it is; framed, it takes the mouse and can be dragged anywhere on any monitor. 'Lock here' in the frame or 'Lock it here' on the page keeps it where it was let go, read back from the window, and clicks go through it again. When the new place cannot be read the overlay is back where it was and the page says so. Leaving the Overlay page while it is framed (to press Play, say) locks it where it is, so it is not left over the game taking clicks and the keyboard."
      - "The place belongs to the monitor by what it is, not by where it is on the desktop: after another monitor layout the overlay is on the same monitor at the same place. While that monitor is off the main screen stands in, the page says which one is away, and the overlay goes back when it is on again. The place is a share of the free room, so it is the same corner on a screen of another size and never off the screen."
      - "The list hangs from the edge it is nearer to, so the newest press is always in the same spot: from the top in the upper half of the screen, from the bottom in the lower half, and set to the side it is on."
      - "Checked once on the owner's rig: the frame dragged with the mouse to another monitor and locked with a click on 'Lock here'; after a switch of monitor layout and back the overlay is where it was put."
    notes:
      - "2026-11-12: built and unit-tested, and the first four criteria run in the app (tests/e2e/overlay.e2e.ts, second test): one of the nine places, the frame, the window moved and locked from the frame, the place kept across a restart of RigReady, another screen, that screen off with the main one standing in, no screen on at all, and the screen back. Not done: the last criterion. The test moves the window by a call and clicks 'Lock here' through the debugger, which is not a drag with a mouse over the drag region of a window that was just made to take the mouse, and its monitors are recorded ones; the check on the owner's rig (dragged to another monitor, locked there, a switch of monitor layout and back) has not been made. A change of monitor layout made while the Overlay page is closed is noticed on the first press that comes at least ten seconds after the last look, not at once."
      - "2026-11-13: a part left framed when the page was left stayed framed over the game, where it took clicks and could take the keyboard (found by the review of 13 Nov). The Overlay page now locks it where it is when it is left (tests/e2e/overlay.e2e.ts, second test, picture overlay-placing/05-locked-on-leaving.png). Not covered: Play from the tray, a shortcut or a hotkey while the Overlay page stays open in the window; the main side has no way yet for the overlay to hear of a launch."
