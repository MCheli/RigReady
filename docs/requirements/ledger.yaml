  - id: FLY-020
    title: Action wait-for-completion and timeout
    job: fly
    area: fly
    priority: p0
    done_means:
      - "Each action has waitForCompletion (default false for programs, true for scripts) and timeoutSeconds (default 30)."
      - "With waitForCompletion true, the next action starts only after exit; a script exceeding its timeout is killed and marked 'timed out after 30 s'."
      - "With waitForCompletion false, the next action starts as soon as the process has spawned."
      - "Unit tests with fake Clock and fake Shell cover wait, no-wait and timeout."
    status: done
    evidence:
      - 'src/features/fly/core/fly.test.ts#an action that hangs is timed out; waiting and not waiting for a script are honoured'
      - 'src/features/processes/core/processCheck.test.ts#as a launch action can wait for the program to finish, within its timeout'
      - 'src/features/checks-generic/core/checks.test.ts#the fix shows the exact command to confirm, runs it, and reports exit codes and output'
      - 'artifacts/screens/fly-launch-actions/02-launched.png'

