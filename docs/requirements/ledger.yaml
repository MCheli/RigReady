  - id: WOW-WIN-003
    title: A desktop shortcut per setup
    job: configure
    area: profiles
    priority: p2
    done_means:
      - "The setup editor has a 'Desktop shortcut' panel: 'Create desktop shortcut' writes \"<setup name> - RigReady.lnk\" on the Desktop (characters a file name cannot hold become dashes: 'DCS F/A-18C' is 'DCS F-A-18C - RigReady.lnk') that starts this RigReady with --launch=<setup id>; a setup that launches nothing gets --make-ready."
