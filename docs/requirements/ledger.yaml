  - id: WOW-TOOLS-007
    title: The trainer takes only a meant press for an answer
    job: configure
    area: cheat-sheet
    priority: p1
    done_means:
      - "A control answers a card once it has been held for about a third of a second, or tapped: let go sooner with nothing else changing on its controller and no axis travelling. A position a lever or a hat only passes is neither: it is not counted and nothing is said of it. Only the control the card asks for is said when it was let go too soon to count. While a control is held and weighed, a thin line grows across the card until it counts. A plain press is not made slow: it is judged within the hold, and the next card is up within a second of it."
      - "Where a control rests is not a press: what a controller holds when it is first heard, when the round starts and when a card comes up answers only after it has gone off and come on again. A card whose control is already held where it rests says so in one line ('Already there: move it away and back to answer.') until the control is moved, and then 'Now move it back.' until it is back. The next card comes once the answering control is let go, the verdict has been on screen for a moment, nothing has changed or travelled for a moment and every switch of the round is back where it was when the card came up, so the way back to rest happens before the next card and not on it: a slow way back does not answer the next card when that card asks for the place the switch rests in. A switch that is not put back holds the next card for two seconds and no longer. Axes never answer, and one that never comes to rest cannot hold the next card back for ever."
      - "A wrong answer needs a control that is new to the question. A control that goes back to where it rested, and the control used on the card before the first time it comes on again, are said under the card and not counted as a miss; the right control always counts. The owner's sitting of 12 November 2026 plays back without a wrong answer that was not one."
      - "An action bound in more than one place is one card: every place is named ('Button 25 or Button 28 on Throttle'), every place is lit on the picture, on both pictures when the places are on two devices, and any of them is right. Two pictures are side by side when the window has room for 400 pixels each (a window about 1500 pixels wide), with the card and both pictures on screen and nothing to scroll, and one below the other in a narrower window. A round for one device asks only for the places on that device. What was missed is listed with every place."
      - "In a round for one device, a press on another device is said to be on another device, by name, and is not counted. In a round for all devices the same press is an answer."
      - "A window that starts to listen while another window listens is told where every control is, marked as rest and not as a press: the trainer opened beside the popped-out quick look does not take a switch that is on for an answer, and the pop-out does not take it for the last press."
      - "A switch position or a throttle stop counts once it has been there about a third of a second, and is not let go: the next card comes with it where it was put, without waiting for the other positions of its control, and the card says 'Leave it there for the next card.' A position is taken for one that stays when it, or another position of the same control, was held when the round or a card began. Which buttons are positions of one control comes from the device's drawing (the one its sheet is drawn with, else RigReady's), or from the list of a known device; what is drawn as a hat, a mini-stick, a lever or trigger, a button or a key springs back and is left out. When a card asks for the position its control is already in, another position of that control on the way away and back is not a wrong answer, is not weighed and is not said. The owner's throttle at rest on 13 November 2026 (Buttons 23, 30, 31, 4, 41 and 58 held) plays back: the left handle to IDLE from IDLE, the upper thumb switch forward, the right handle to OFF, with nothing let go."
    notes:
      - "2026-11-13: at the second look on the rig 'Left throttle to IDLE' was hard to answer: the handle rests at IDLE, so it had to go to OFF and back, and then be moved off IDLE again because the next card waited for it to be let go (finding T1). Stops and switch positions are now left where they are put. The drawings do not mark which positions stay put, so that is taken from what was seen resting; a switch whose positions nothing tells apart from buttons, never seen resting in one, still waits to be let go or put back."
    status: done
    evidence:
      - "src/features/cheat-sheets/core/trainerRound.test.ts#already there as its card comes up: said; moved away, not an answer; back, it answers and stays"
      - "src/features/cheat-sheets/core/trainerRound.test.ts#moved to the stop the card asks for: right after a moment, and the next card comes with it left there"
