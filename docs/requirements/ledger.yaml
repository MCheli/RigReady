  - id: OVERLAY-002
    title: The overlay window is over the game and out of its way
    job: fly
    area: overlay
    priority: p2
    done_means:
      - "Each part of the overlay is a window of its own with no frame and nothing painted behind what it shows, kept above other windows, not in the taskbar, that cannot be given the keyboard and lets the mouse through to what is under it. While nothing is pressed nothing is drawn (E2E for on top, never focused and nothing painted behind; Electron cannot be asked whether clicks go through, so that part is the rig check below)."
