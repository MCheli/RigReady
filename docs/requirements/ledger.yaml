    priority: p1
    done_means:
      - "When the action in the bind dialog is the one that shows or hides the kneeboard (DCS: 'Kneeboard ON/OFF') and a page action ('Kneeboard Next Page', 'Kneeboard Previous Page') is on no controller, the dialog says that this action shows and hides the kneeboard, that its pages turn with the other actions, names each one that is on no controller and where it is now ('] on the keyboard', or 'Not bound'), and says to bind it to a button too."
      - "It is said only when true: not for any other action (the glance view, the mark point, the shortcuts and the page actions included), not for an aircraft with no action that turns a page, and not once every page action is on a controller. A binding on a control the device does not have does not count."
      - "Changes that wait to be saved count: a page action staged onto a button is not named, and one whose button is cleared, or given to another action in this very dialog, is."
      - "'Add this and bind them next' stages the binding made and opens the dialog on the first page action, on the same device, then on the second ('After this one: Kneeboard Previous Page.'). Cancel ends it and keeps what is staged. A page action RigReady cannot write a binding for is not offered, and the note says to bind it in DCS's own controls screen."
      - "Scenario mark-flight (dcs-bindings-hornet): binding 'Kneeboard ON/OFF' to Button 14 of the stick shows the note with both page actions on the keyboard; the offer leads through Button 33 and Button 35; three changes are saved to the stick's file; binding show or hide again shows no note (E2E)."
