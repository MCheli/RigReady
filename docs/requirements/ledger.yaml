  - id: WOW-FLY-005
    title: Compact view - the daily routine in a small window that stays on top
    job: fly
    area: fly
    priority: p2
    done_means:
      - "'Compact view' in the Play menu opens one small window that stays on top of the others (asked for again, the same window comes forward). It shows the readiness dial, the setup switcher, the state in words and the one action of the Play screen, with Re-check and Stand down at the foot; nothing in it needs scrolling."
      - "The one action is the Play screen's: Make ready and launch, Launch, or Stand down after a session, on Enter as well. The 'Keep this layout?' question is answered in the small window too. Launching hides the main window as the user's setting says; the small window stays, with the session and its clock, then 'Welcome back' and Stand down."
      - "Launch on a rig that is not ready launches nothing: the button becomes 'Launch anyway', with what is not met in words and a Cancel. When Make ready and launch stops on something required, the same is offered. 'Launch anyway' is a click (or the button focused and pressed): Enter with nothing focused does not run it, and the Enter hint is not shown on it."
      - "A fix or a launch step that runs a program has to be shown to the user before it runs, and the small window has no room for that: the action is then disabled there, with the reason in words, and one button brings the full window back (on a monitor that is on; where it is when the monitors cannot be read)."
      - "A setup chosen in one window is the setup in every window of RigReady: the main process says when the setup in use changes, and only then."
