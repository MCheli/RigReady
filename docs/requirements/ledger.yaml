  - id: OVERLAY-004
    title: Presses fade away, and the user sets how long they stay
    job: fly
    area: overlay
    priority: p2
    done_means:
      - "A line is clear for the first part of its time and fades out over the rest; when its time is over it is gone, whether or not the control is still held. Each line goes at its own time. To begin with a press is shown for 5 seconds (E2E: the fading as the browser runs it, and the time a line really lived)."
      - "'Shown for' sets the time from 1 to 30 seconds, 'Lines' the most presses shown at once from 1 to 10 (the oldest makes room, the newest is always there), 'Size' small, medium or large. Each applies at once to the overlay that is up, and the window is exactly as large as the most lines it may show. A longer time does not bring back a line that was gone."
      - "Where Windows is set to show no animations a line does not fade: it stays clear and goes when its time is over."
      - "The preview on the page is the same list at the size it has over the game, on a bright background, and shows what is pressed while the overlay is on."
      - "While the overlay is off the preview shows two example lines, each marked 'Example' in the line itself, so that size and lines can be judged before it is turned on. They follow Size and Lines as they are set, are never among the presses and never in the window over the game, and are gone the moment the overlay is on (E2E, scenario cheat-sheets-hornet; and on generic-fresh, where they are two plain lines that name no hardware)."
    notes:
      - "2026-11-12: done. Built and unit-tested (when a line is over, how old it is, the limits, the size of the window), then measured in the app (tests/e2e/overlay.e2e.ts, first test): the fade as the browser runs it, a line that lived its five seconds and was gone, no fade where less motion is asked for, the time, the lines and the size applied to the window that was up, and the preview with the same lines. A still picture cannot show a fade: the test reads the animation. How readable the lines are over a bright cockpit has been worked out (the dark plates give the words at least 4.5 to 1 over white) and looked at over the preview's bright background, not over a game: that belongs to the rig check of OVERLAY-002."
      - "2026-11-12, later, asked for by the owner: example lines in the preview while the overlay is off. What they are: buttons and hats (never an axis) that do something for the aircraft or car chosen, on a controller the bindings know; a controller that is attached before one that is not, what the user bound before what the game binds by itself, the controller with the most of the user's own bindings first, buttons before hats, then the game's order and the number of the button; the first two. On the recorded rig that is 'UFC I/P Pushbutton' and 'UFC Keyboard Pushbutton - 1' on the panel under the HUD; the first rule tried took the first controller of the game's list and gave the hat of a wheel base with 'View Down slow', which says little about an aircraft. With no bindings to go by they are 'Button 1' and 'Hat 1 up' on 'Your controller'. They are worded by the code that words a press (rowWords, pressActions), so an example reads as that press will. They are in overlay:state only while the overlay is off, the feed of presses never holds them, and the window over the game does not exist then and is never handed any. The mark is a light chip at the start of the small line, so the large words keep the room they have over the game. Examples do not fade. Seen in the app: tests/e2e/overlay.e2e.ts, first and third test."
    status: done
