version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Major versions are deliberate migrations: Electron's version is chosen by
    # the owner, Vuetify 4 is a migration. Other majors arrive as their own PRs.
    ignore:
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vuetify"
        update-types: ["version-update:semver-major"]
    # Patch and minor updates are grouped (one PR for dev, one for prod).
    # Anything not matched by a group, i.e. majors, gets its own PR.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
  # The workflows pin every action to a commit; this keeps those pins moving with
  # the actions' releases, one grouped pull request a week.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
