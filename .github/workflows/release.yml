name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Three stages. `prepare` fails an undated changelog or a mismatched tag in seconds; `tests`
# is CI's own workflow (the check, the three scenario shards and the packaged smoke, side by
# side on their own runners); `release` builds the installer once those are green. Before,
# one job ran everything one after the other and took about 45 minutes.
jobs:
  prepare:
    name: Tag and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag and the version in package.json must be the same version, or the update
      # feed would describe a version that is not the one inside the installer.
      - name: Tag matches package version
        shell: pwsh
        # The tag name reaches the script as a variable, never as part of its text.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) {
            Write-Error "Tag $env:TAG does not match package.json version $version"
            exit 1
          }

      # The release's description is the version's section of CHANGELOG.md, whose heading
      # must carry the date by now. First, so that an undated changelog fails in seconds and
      # not after the tests below. The script needs nothing installed.
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs $env:TAG artifacts/release-notes.md

  tests:
    name: Tests
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and release
    runs-on: windows-latest
    needs: [prepare, tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # The runner's virus scanner scans every file as it is written, which makes npm ci and
      # the build several times slower; the tests had it off too (ci.yml).
      - name: Prepare the runner
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Host "virus scanner left on: $_" }

      - run: npm ci

      # The same section of CHANGELOG.md the prepare job checked, written again here for the
      # draft's description: the file does not travel between jobs.
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs $env:TAG artifacts/release-notes.md

      # The DirectInput sidecar needs its Python runtime inside the installer.
      - run: npm run setup:python

      # electron-builder never publishes (--publish never); the release step below does.
      # The build is signed through Azure Artifact Signing when the repository has the five
      # RIGREADY_SIGN_* variables and the three AZURE_* secrets, and is the plain unsigned
      # build when it has none of them; anything in between fails here with a message
      # (docs/RELEASING.md, "Code signing"). Only this step sees these values.
      - name: Build installer
        run: npm run dist
        env:
          RIGREADY_SIGN_ENDPOINT: ${{ vars.RIGREADY_SIGN_ENDPOINT }}
          RIGREADY_SIGN_ACCOUNT: ${{ vars.RIGREADY_SIGN_ACCOUNT }}
          RIGREADY_SIGN_PROFILE: ${{ vars.RIGREADY_SIGN_PROFILE }}
          RIGREADY_SIGN_PUBLISHER: ${{ vars.RIGREADY_SIGN_PUBLISHER }}
          RIGREADY_SIGN_PUBLISHER_DN: ${{ vars.RIGREADY_SIGN_PUBLISHER_DN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # The check an installed RigReady makes on every downloaded update, made on the new
      # installer by electron-updater's own code (scripts/verify-update-signature.ts) with the
      # publisher names the build put into the package: the certificate's full DN, then its CN.
      # It fails unless the DN matches. An installed copy would still take the update by the
      # CN, so a certificate whose details changed is caught here and the DN put right before
      # the release, instead of every update after it passing by the CN alone.
      - name: Check the update signature as installed copies will
        if: vars.RIGREADY_SIGN_PUBLISHER != ''
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          npx tsx scripts/verify-update-signature.ts --installer "release/RigReady-Setup-$version.exe" --feed release/win-unpacked/resources/app-update.yml

      # A signed build is checked the way an installed RigReady will check it as an update:
      # signtool and Get-AuthenticodeSignature on the installer, then on the program and the
      # uninstaller it installs (silently, into a temporary folder, removed again), and the
      # check above once more with the feed file of that install. A failure stops the release.
      - name: Verify the signatures
        if: vars.RIGREADY_SIGN_PUBLISHER != ''
        shell: pwsh
        env:
          PUBLISHER: ${{ vars.RIGREADY_SIGN_PUBLISHER }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-signed-installer.ps1 -Installer "release/RigReady-Setup-$version.exe" -Publisher $env:PUBLISHER

      # The installer, its block map (partial downloads) and latest.yml, the feed file the
      # installed app reads. electron-builder names the feed file latest.yml for every
      # version when the publish provider is GitHub; a beta is told apart by the pre-release
      # flag, and the app's beta channel reads latest.yml from the newest pre-release.
      # A draft: the release checklist (docs/RELEASING.md) is worked through before a person
      # publishes it.
      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
          body_path: artifacts/release-notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
