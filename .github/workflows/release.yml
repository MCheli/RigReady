name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      # The same preparation as CI gives its jobs: the runner's virus scanner scans every
      # file as it is written, which makes the tests' temp-folder work several times slower
      # (the unit tests have timed out on it), and its 1024x768 desktop does not fit the
      # app's window, which the end-to-end and packaged runs below need.
      - name: Prepare the runner
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Host "virus scanner left on: $_" }
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "screen size not changed: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      - run: npm ci

      # The tag and the version in package.json must be the same version, or the update
      # feed would describe a version that is not the one inside the installer.
      - name: Tag matches package version
        shell: pwsh
        # The tag name reaches the script as a variable, never as part of its text.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) {
            Write-Error "Tag $env:TAG does not match package.json version $version"
            exit 1
          }

      # The release's description is the version's section of CHANGELOG.md, whose heading
      # must carry the date by now. First, so that an undated changelog fails in seconds and
      # not after the forty minutes of tests below.
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs $env:TAG artifacts/release-notes.md

      - run: npm run check

      - run: npm run test:e2e

      # The DirectInput sidecar needs its Python runtime inside the installer.
      - run: npm run setup:python

      # The unpacked app is started for real before anything is released.
      - run: npm run smoke:packaged

      # electron-builder never publishes (--publish never); the step below does.
      - name: Build installer
        run: npm run dist

      # The installer, its block map (partial downloads) and latest.yml, the feed file the
      # installed app reads. electron-builder names the feed file latest.yml for every
      # version when the publish provider is GitHub; a beta is told apart by the pre-release
      # flag, and the app's beta channel reads latest.yml from the newest pre-release.
      # A draft: the release checklist (docs/RELEASING.md) is worked through before a person
      # publishes it.
      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
          body_path: artifacts/release-notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
