name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # The tag and the version in package.json must be the same version, or the update
      # feed would describe a version that is not the one inside the installer.
      - name: Tag matches package version
        shell: pwsh
        # The tag name reaches the script as a variable, never as part of its text.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) {
            Write-Error "Tag $env:TAG does not match package.json version $version"
            exit 1
          }

      - run: npm run check

      - run: npm run test:e2e

      # The DirectInput sidecar needs its Python runtime inside the installer.
      - run: npm run setup:python

      # The unpacked app is started for real before anything is released.
      - run: npm run smoke:packaged

      # electron-builder never publishes (--publish never); the release step below does.
      # The build is signed through Azure Artifact Signing when the repository has the four
      # RIGREADY_SIGN_* variables and the three AZURE_* secrets, and is the plain unsigned
      # build when it has none of them; anything in between fails here with a message
      # (docs/RELEASING.md, "Code signing"). Only this step sees these values.
      - name: Build installer
        run: npm run dist
        env:
          RIGREADY_SIGN_ENDPOINT: ${{ vars.RIGREADY_SIGN_ENDPOINT }}
          RIGREADY_SIGN_ACCOUNT: ${{ vars.RIGREADY_SIGN_ACCOUNT }}
          RIGREADY_SIGN_PROFILE: ${{ vars.RIGREADY_SIGN_PROFILE }}
          RIGREADY_SIGN_PUBLISHER: ${{ vars.RIGREADY_SIGN_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # A signed build is checked the way an installed RigReady will check it as an update:
      # signtool and Get-AuthenticodeSignature on the installer, then on the program and the
      # uninstaller it installs (silently, into a temporary folder, removed again), and the
      # publisher in the feed file it carries. A failure here stops the release.
      - name: Verify the signatures
        if: vars.RIGREADY_SIGN_PUBLISHER != ''
        shell: pwsh
        env:
          PUBLISHER: ${{ vars.RIGREADY_SIGN_PUBLISHER }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-signed-installer.ps1 -Installer "release/RigReady-Setup-$version.exe" -Publisher $env:PUBLISHER

      # The installer plus the update feed the installed app reads: latest.yml for a
      # release, beta.yml for a version tagged x.y.z-beta.n, and the block map for
      # partial downloads. A draft: the release checklist (docs/RELEASING.md) is worked
      # through before a person publishes it.
      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/beta.yml
          draft: true
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
