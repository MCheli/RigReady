name: CI

on:
  # Pushes to main, and every pull request into main (PLAT-016). A branch with a pull request
  # is checked once, by the pull_request run; a push run on it as well only doubled the e2e
  # suite, and either run failing blocks the merge.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repository; the token can only read it.
permissions:
  contents: read

jobs:
  check:
    name: Check (typecheck, lint, format, unit tests, ledger)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run check

  e2e:
    name: Scenario end-to-end
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      # GitHub's Windows runners scan every file as it is written, which makes the temp-folder
      # work of the tests several times slower, and their desktop is 1024x768: the app's
      # window does not fit it, and the tests are about a normal desktop.
      - name: Prepare the runner
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Host "virus scanner left on: $_" }
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "screen size not changed: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      - run: npm ci

      # Builds the app, then drives it on fixture-backed providers. No real hardware is needed.
      - run: npm run test:e2e

      - name: Upload screenshots and failure output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            artifacts/screens/
            artifacts/playwright/
          retention-days: 14

  packaged:
    name: Packaged smoke (the unpacked app, as built for release)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      # GitHub's Windows runners scan every file as it is written, which makes the temp-folder
      # work of the tests several times slower, and their desktop is 1024x768: the app's
      # window does not fit it, and the tests are about a normal desktop.
      - name: Prepare the runner
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Host "virus scanner left on: $_" }
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "screen size not changed: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      - run: npm ci

      # The DirectInput sidecar's Python runtime, which the package must contain.
      - run: npm run setup:python

      # electron-builder --dir, then the packaged app is started for real: enumeration of
      # the runner's devices and displays, a scenario up to the Fly screen, the updater
      # against a feed on the runner, memory in the tray. A failure here fails CI.
      # Tests that need a game controller or a desktop skip themselves when CI is set.
      - run: npm run smoke:packaged

      - name: Upload screenshots and failure output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-artifacts
          path: |
            artifacts/screens/packaged-*/
            artifacts/playwright-packaged/
          retention-days: 14
