name: CI

on:
  # Pushes to main, and every pull request into main (PLAT-016). A branch with a pull request
  # is checked once, by the pull_request run; a push run on it as well only doubled the e2e
  # suite, and either run failing blocks the merge.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Release workflow runs these same jobs on a tag (release.yml, `uses:`), so what is
  # tested before a release is exactly what is tested on every pull request.
  workflow_call:

# Nothing here writes to the repository; the token can only read it.
permissions:
  contents: read

# A new push to a pull request ends the run on the commit before it: nothing can be merged on
# that result any more, and its Windows runners go to the commit that counts. Only pull
# requests: a push to main and a release are each in a group of their own (the run's id), so
# neither is ever cancelled nor waits for another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs are independent: each checks out and installs for itself, and none waits for
# another's work, so a run takes the time of its longest job and not the sum. The two suites
# that are too long for one runner are cut into shards on runners of their own: the unit tests
# (Vitest's --shard) and the scenario flows (the Playwright config reads E2E_SHARD). Each has
# one job that sums its parts up under the name the branch ruleset requires:
# "Check (typecheck, lint, format, unit tests, ledger)" and "Scenario end-to-end".
jobs:
  # `npm run check` without its unit tests, in the command's own order.
  static:
    name: Typecheck, lint, format, ledger
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run ledger:check

  # The unit tests of `npm run check`, a quarter of the test files on each of four runners. On
  # one runner they took eight to thirteen minutes and were the longest job of every run. A
  # shard measures coverage but is not held to the limits (a quarter of the tests reaches a
  # half to three quarters of the lines); the limits are applied once, to the four reports
  # together, by the job below.
  unit:
    name: Unit tests (shard ${{ matrix.shard }} of 4)
    runs-on: windows-latest
    strategy:
      # One shard failing must not stop the others: their results say whether the failure is
      # one test or the runner.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # The runner scans every file as it is written, which makes the unit tests' temp-folder
      # work several times slower: five of them timed out at 30 s on 2026-11-06 (the suite took
      # 694 s). The other jobs switch the scanner off below; this one does too.
      - name: Prepare the runner
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Host "virus scanner left on: $_" }

      - run: npm ci

      - run: npm run test:coverage:shard -- --shard=${{ matrix.shard }}/4

      # Vitest's report of this shard (tests and coverage), for the job below. A shard that
      # wrote none fails here. Kept a week, so that one failed job can be run again later
      # without running the others again.
      - name: Keep the report for the coverage job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-report-shard-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The coverage limits of vitest.config.ts, applied to the four reports together: the figures
  # are those of one run of all the tests. It runs only when every shard passed. Vitest merges
  # whatever reports it finds, and three of four still clear the limits, so the reports are
  # counted first.
  coverage:
    name: Unit test coverage (the shards together)
    runs-on: windows-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Fetch the shards' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-report-shard-*
          path: .vitest/blob
          merge-multiple: true

      - name: Every shard's report is here
        shell: pwsh
        run: |
          $found = @(Get-ChildItem .vitest/blob -Filter 'blob-*-4.json').Count
          Write-Host "reports: $found of 4"
          if ($found -ne 4) { exit 1 }

      - run: npm run test:coverage:merge

  # The one check the ruleset on main requires under this name: green only when every part of
  # `npm run check` passed. It runs whatever happened to the parts, so a cancelled, failed or
  # skipped one shows up here as a failure and not as a check that never reported.
  check:
    name: Check (typecheck, lint, format, unit tests, ledger)
    runs-on: ubuntu-latest
    needs: [static, unit, coverage]
    if: always()
    steps:
      - name: Every part passed
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          echo "typecheck, lint, format, ledger: $STATIC"
          echo "unit test shards: $UNIT"
          echo "coverage of the shards together: $COVERAGE"
          test "$STATIC" = success && test "$UNIT" = success && test "$COVERAGE" = success

  e2e:
    name: Scenario end-to-end (shard ${{ matrix.shard }} of 4)
    runs-on: windows-latest
    strategy:
      # One shard failing must not stop the others: their results say whether the failure is
      # one test or the runner.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # GitHub's Windows runners scan every file as it is written, which makes the temp-folder
      # work of the tests several times slower, and their desktop is 1024x768: the app's
      # window does not fit it, and the tests are about a normal desktop.
      - name: Prepare the runner
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Host "virus scanner left on: $_" }
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "screen size not changed: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      - run: npm ci

      # Builds the app, then drives this shard's quarter of the scenario flows on fixture-backed
      # providers. No real hardware is needed.
      - run: npm run test:e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}/4

      - name: Upload screenshots and failure output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-shard-${{ matrix.shard }}
          path: |
            artifacts/screens/
            artifacts/playwright/
          retention-days: 14

  # The one check the ruleset on main requires under this name: green only when every shard
  # passed. It runs whatever happened to the shards, so a cancelled or failed shard shows up
  # here as a failure and not as a check that never reported.
  e2e-result:
    name: Scenario end-to-end
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "shards: $RESULT"
          test "$RESULT" = success

  packaged:
    name: Packaged smoke (the unpacked app, as built for release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # GitHub's Windows runners scan every file as it is written, which makes the temp-folder
      # work of the tests several times slower, and their desktop is 1024x768: the app's
      # window does not fit it, and the tests are about a normal desktop.
      - name: Prepare the runner
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Host "virus scanner left on: $_" }
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "screen size not changed: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      - run: npm ci

      # The DirectInput sidecar's Python runtime, which the package must contain.
      - run: npm run setup:python

      # electron-builder --dir, then the packaged app is started for real: enumeration of
      # the runner's devices and displays, a scenario up to the Fly screen, the updater
      # against a feed on the runner, memory in the tray. A failure here fails CI.
      # Tests that need a game controller or a desktop skip themselves when CI is set.
      - run: npm run smoke:packaged

      - name: Upload screenshots and failure output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-artifacts
          path: |
            artifacts/screens/packaged-*/
            artifacts/playwright-packaged/
          retention-days: 14
