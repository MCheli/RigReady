name: Website

# rigready.io: site/ built by site/build.mjs and published to GitHub Pages. It is rebuilt when the
# site, the changelog, the manual, the contributing guide or the version changes on main, and
# when a release is published, edited or withdrawn, so the downloads, the changelog and the manual
# always match GitHub Releases and the repository's documents.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'docs/manual/**'
      - 'docs/requirements/ledger.yaml'
      - 'package.json'
      - '.github/workflows/site.yml'
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release event runs on the release's tag, and only main may deploy to the github-pages
  # environment. So a release starts this workflow again on main, which then builds and deploys.
  # (workflow_dispatch is one of the events GITHUB_TOKEN is allowed to trigger.)
  on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the website from main
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # No npm install: the build script has no dependencies.
      - name: Build
        run: node site/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
