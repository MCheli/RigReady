description: A generic PC with Nuclear Option, a Warthog stick and throttle plugged in, and the bindings the game saved
rig: generic-rig
extends: games-nuclear-option.yaml
# Written by hand for the Nuclear Option bindings page (docs/research/nuclear-option.md).
# The registry values are the files in fixtures/nuclear-option (made up, in the exact shape
# the game's Rewired library saves them) as REG_BINARY: UTF-8 text and a zero byte.
# src/features/nuclear-option-bindings/core/fixture.test.ts fails when the two differ.
# The stick is saved the way a current game build names a controller, with the map an
# earlier build left behind beside it; the throttle only the earlier way.
# The pedals the game has bindings for are not plugged in.
mutations:
  - op: plugDevice
    device:
      instanceId: 'USB\VID_044F&PID_0402\6&2c41a7f0&0&4'
      vendorId: 044F
      productId: '0402'
      name: Joystick - HOTAS Warthog
      isHid: true
      isGameController: true
      isHub: false
      hubChain:
        - { instanceId: 'USB\ROOT_HUB30\4&1f2e3d4c&0&0', name: USB Root Hub (USB 3.0) }
      manufacturer: Thrustmaster
    controller:
      name: Joystick - HOTAS Warthog
      guid: 3A7C1E20-7A11-11EF-8001-444553540000
      productGuid: 0402044F-0000-0000-0000-504944564944
      vendorId: 044F
      productId: '0402'
      numAxes: 2
      numButtons: 19
      numHats: 1
      axisNames: [X, Y]
  - op: plugDevice
    device:
      instanceId: 'USB\VID_044F&PID_0404\6&2c41a7f0&0&5'
      vendorId: 044F
      productId: '0404'
      name: Throttle - HOTAS Warthog
      isHid: true
      isGameController: true
      isHub: false
      hubChain:
        - { instanceId: 'USB\ROOT_HUB30\4&1f2e3d4c&0&0', name: USB Root Hub (USB 3.0) }
      manufacturer: Thrustmaster
    controller:
      name: Throttle - HOTAS Warthog
      guid: 3A7C1E21-7A11-11EF-8002-444553540000
      productGuid: 0404044F-0000-0000-0000-504944564944
      vendorId: 044F
      productId: '0404'
      numAxes: 5
      numButtons: 32
      numHats: 1
      axisNames: [X, Y, Z, RZ, SLIDER1]
