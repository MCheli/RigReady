description: The built-in assistant against a monthly budget (two scripted Anthropic answers whose estimates fill it, so the third message is held back)
rig: mark-full
extends: flying-fresh.yaml
# Each answer reports 21,000 tokens in and 2,000 out. At the prices the scenario test types
# in Settings ($8 in and $40 out per million tokens) that is estimated at just under $0.25.
http:
  - match: { url: 'api.anthropic.com/v1/models/', method: GET }
    response: { status: 200, json: { id: claude-opus-5-5, type: model, display_name: Claude Opus 5.5 } }
  - match: { url: 'api.anthropic.com/v1/messages', method: POST }
    times: 1
    response:
      status: 200
      json:
        id: msg_1
        type: message
        role: assistant
        model: claude-opus-5-5
        stop_reason: end_turn
        usage: { input_tokens: 21000, output_tokens: 2000 }
        content:
          - type: text
            text: |-
              No. **TrackIR** is a check of that setup, not a launch step: Make ready starts it when it is not running.
  - match: { url: 'api.anthropic.com/v1/messages', method: POST }
    times: 1
    response:
      status: 200
      json:
        id: msg_2
        type: message
        role: assistant
        model: claude-opus-5-5
        stop_reason: end_turn
        usage: { input_tokens: 21000, output_tokens: 2000 }
        content:
          - type: text
            text: |-
              SRS is not part of that setup. Ask me to add a check for it and I will propose one.
