description: Binding guide for iRacing, on the racing rig with control profiles and three cars with their own
rig: mark-full
extends: iracing-bindings-profiles.yaml
# The racing rig on iRacing 2026.11 with the profile "Baseline" for all cars (the owner's real one
# of 13 Nov 2026 with the recorded rig's made-up device ids), except that its clutch axis is left
# unbound, as a user with two pedals has it: data/ai-assist/iracing-profile-no-clutch.cfg differs
# from data/iracing-bindings/profile-controls.cfg in that one record. Three cars have controls of
# their own (app.ini [ControlProfiles]): porsche992rgt3 and ferrari296gt3, whose folder names
# say GT3, share the profile "GT3 Cars"; cadillacctsvr, whose name says no class, has the
# profile "Test Profile CTSV". Each profile holds the same file as Baseline.
mutations:
  - op: writeFile
    path: Documents/iRacing/app.ini
    from: data/ai-assist/iracing-app.ini
  - op: writeFile
    path: Documents/iRacing/profiles/controls/Baseline/controls.cfg
    from: data/ai-assist/iracing-profile-no-clutch.cfg
  - op: writeFile
    path: Documents/iRacing/profiles/controls/GT3 Cars/controls.cfg
    from: data/ai-assist/iracing-profile-no-clutch.cfg
  - op: writeFile
    path: Documents/iRacing/profiles/controls/Test Profile CTSV/controls.cfg
    from: data/ai-assist/iracing-profile-no-clutch.cfg
