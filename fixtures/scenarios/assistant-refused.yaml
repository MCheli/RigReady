description: The built-in assistant's first request is refused by the provider (HTTP 401) and answered when it is sent again
rig: mark-full
extends: flying-fresh.yaml
# The first request to the Messages API is refused once; the same request sent again is
# answered, with a reply that uses Markdown.
http:
  - match: { url: 'api.anthropic.com/v1/models/', method: GET }
    response: { status: 200, json: { id: claude-opus-5-5, type: model, display_name: Claude Opus 5.5 } }
  - match: { url: 'api.anthropic.com/v1/messages', method: POST }
    times: 1
    response:
      status: 401
      headers: { request-id: req_e2e_refused_1 }
      json:
        type: error
        error: { type: authentication_error, message: invalid x-api-key }
        request_id: req_e2e_refused_1
  - match: { url: 'api.anthropic.com/v1/messages', method: POST }
    times: 1
    response:
      status: 200
      json:
        id: msg_1
        type: message
        role: assistant
        model: claude-opus-5-5
        stop_reason: end_turn
        usage: { input_tokens: 4400, output_tokens: 60 }
        content:
          - type: text
            text: |-
              ## TrackIR

              No. **TrackIR** is a check of that setup, *not* a launch step:

              - the check is `process.running` for `TrackIR5.exe`
              - Make ready starts it when it is not running

              <b onclick="x()">This is shown as text.</b>

              See [how the assistant works](https://rigready.io/docs/ai/built-in-assistant/).
