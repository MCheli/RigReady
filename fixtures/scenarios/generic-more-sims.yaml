description: A generic PC with eleven more flight and racing sims (Steam, standalone X-Plane 11, Falcon BMS)
rig: generic-rig
extends: generic-fresh.yaml
# Written by hand for the game modules added in November 2026 (docs/research/game-modules-2026-11.md).
# Every file is small and synthetic, in the layout the game uses. Steam has two libraries;
# X-Plane 11 is a standalone install recorded in x-plane_install_11.txt; Falcon BMS is found
# through its registry key. F1 24 is not installed, so it is listed as not found.
mutations:
  - op: setRegistryValue
    hive: HKCU
    key: Software\Valve\Steam
    name: SteamPath
    value: { type: string, value: 'C:\Program Files (x86)\Steam' }
  - op: writeFile
    path: "Program Files (x86)/Steam/steam.exe"
    content: ''
  - op: writeFile
    path: "Program Files (x86)/Steam/steamapps/libraryfolders.vdf"
    rehome: true
    content: |
      "libraryfolders"
      {
      	"0"
      	{
      		"path"		"C:\\Program Files (x86)\\Steam"
      		"apps"
      		{
      			"1250410"		"1000000"
      			"2014780"		"1000000"
      			"429530"		"1000000"
      			"805550"		"1000000"
      			"1066890"		"1000000"
      			"1849250"		"1000000"
      			"3059520"		"1000000"
      			"211500"		"1000000"
      		}
      	}
      	"1"
      	{
      		"path"		"C:\\Users\\User\\Games\\SteamLibrary"
